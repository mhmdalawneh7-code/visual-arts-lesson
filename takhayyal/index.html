<head>

<style>

*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:var(--font);background:radial-gradient(ellipse 110% 80% at 50% -30%,#9c4360 0%,var(--wine) 48%,var(--wine2) 100%);color:#fff;direction:rtl}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f2c969;outline-offset:2px}

#artboard:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 30% 10%,rgba(255,255,255,.95),transparent 55%),repeating-linear-gradient(0deg,rgba(125,81,66,.027) 0 1px,transparent 1px 37px),repeating-linear-gradient(90deg,rgba(125,81,66,.02) 0 1px,transparent 1px 37px)}

#lessonHud{position:absolute;top:12px;inset-inline:16px;z-index:5;display:none;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}#lessonHud.visible{display:flex}#lessonHud>*{pointer-events:auto}#sceneTitle{background:rgba(88,21,45,.96);color:#fff;padding:10px 16px;border-radius:12px;font-size:clamp(13px,1.7vw,23px);font-weight:bold;box-shadow:0 3px 8px #4c122133}#stepBadge{background:#fff7e6;color:#6d203a;font-weight:800;border-radius:12px;padding:10px 13px;font-size:clamp(12px,1.4vw,19px)}.hudBtn{border:1px solid #dec5a4;background:rgba(255,252,245,.96);color:#6b2943;border-radius:11px;padding:9px 13px;font-weight:800;font-size:clamp(13px,1.5vw,19px)}.hudBtn:hover{background:#f3e5d0}#timerHud{display:none;align-items:center;gap:7px;color:#6f213d;background:#fff4de;border-radius:14px;padding:7px 13px;font-size:clamp(17px,2.2vw,28px);font-weight:900}#timerHud.visible{display:flex}#timerHud button{border:0;background:transparent;font-size:18px;color:#6f213d}#lessonHint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(255,250,237,.94);color:#785b57;font-size:clamp(12px,1.2vw,17px);border-radius:11px;padding:8px 14px;text-align:center;display:none;max-width:90%}#lessonHint.visible{display:block}
#status{position:absolute;inset-inline-end:11px;top:9px;z-index:6;display:flex;gap:8px;align-items:center}#version{border:1px solid #e2bb82;background:#fff5e9;color:#713550;font:700 12px var(--font);border-radius:999px;padding:5px 10px;opacity:.83}#soundState{display:none;background:#fff8e9;color:#743d4d;border-radius:100px;padding:6px 10px;align-items:center;gap:6px;font-size:12px;font-weight:bold}#soundState.visible{display:flex}#soundDot{width:9px;height:9px;border-radius:50%;background:#ae8c78}#soundState.listening #soundDot{background:#2aaa7e;box-shadow:0 0 0 3px #2aaa7e33}#soundState.hearing #soundDot{background:#ed9e35;animation:pulse .6s infinite}#soundState.decoding #soundDot{background:#8c6dda}#soundState.error #soundDot{background:#d64550;box-shadow:0 0 0 3px #d6455022}@keyframes pulse{50%{transform:scale(1.4)}}

#modalShade{position:fixed;inset:0;background:rgba(30,7,21,.62);z-index:20;display:none;place-items:center;padding:16px;backdrop-filter:blur(5px)}#modalShade.open{display:grid}#modal{width:min(92vw,900px);max-height:min(88dvh,900px);overflow:auto;background:#fffaf1;color:#40212d;border-radius:22px;box-shadow:0 30px 80px #15010c88;padding:clamp(16px,2.5vw,32px)}#modalHeader{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #e8d6c1;padding-bottom:16px;margin-bottom:20px}#modalTitle{margin:0;color:#64233e;font-size:clamp(22px,2.8vw,34px)}#closeModal{border:0;color:#733047;background:#eadfd2;border-radius:11px;min-width:42px;height:42px;font-size:24px}#modalBody{font-size:18px;line-height:1.8}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.tile{min-height:110px;background:white;border:2px solid #ecd7c3;border-radius:14px;color:#4e253a;text-align:center;font-weight:800;font-size:19px;padding:15px 8px;transition:.15s}.tile:hover{transform:translateY(-2px);border-color:#a3516a}.tile small{display:block;font-size:13px;color:#ac7581;font-weight:500}.btn{border:0;background:#6a1e3b;color:white;border-radius:12px;padding:11px 17px;margin:5px;font-weight:800;font-size:16px}.btn.alt{background:#e9d7c5;color:#5c2940}.btn.green{background:#0b8b6a}.field{width:100%;padding:12px 13px;border:2px solid #e1c9bb;border-radius:12px;background:#fff;font-size:18px;color:#3b2230;margin:7px 0 14px}.muted{color:#866b71;font-size:15px}.pill{display:inline-block;background:#f2e2ca;padding:5px 13px;border-radius:30px;margin:3px;font-weight:700;color:#65314b}.quizOption{display:block;width:100%;border:2px solid #ddc7b9;border-radius:14px;padding:14px 18px;text-align:right;background:#fff;color:#42283a;margin:9px 0;font-size:21px;font-weight:750;transition:.2s}.quizOption.good{background:#c7f4df;border-color:#178760;color:#105a3b}.quizOption.bad{background:#ffe0b8;border-color:#d17d2b;color:#86501c}.quizOption:disabled{cursor:default}.quizTitle{font-size:clamp(22px,2.5vw,30px);color:#5f1f3d;font-weight:900}.quizTop{display:flex;justify-content:space-between;flex-wrap:wrap;color:#8e5260;font-weight:800}.criteria{display:grid;gap:10px}.criterion{display:grid;grid-template-columns:1fr auto;gap:14px;background:white;padding:15px;border-radius:12px;border:1px solid #ebd5c1}.bigResult{text-align:center;font-weight:900;font-size:clamp(32px,5vw,66px);color:#137c62}#toast{position:fixed;bottom:104px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;background:#542136;color:#fff;padding:13px 20px;border-radius:13px;box-shadow:0 10px 25px #1d031178;max-width:85vw;text-align:center;font-size:17px;transition:.2s}#toast.on{opacity:1;transform:translate(-50%,0)}
#studentLayer{display:none;position:absolute;inset:0;z-index:3}#studentLayer.open{display:block}#teacherGhost{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none}#studentCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}#studentTools{display:none;position:absolute;z-index:6;bottom:14px;right:50%;transform:translateX(50%);border:1px solid #dec9ae;background:#fff9e9ed;color:#69304b;border-radius:15px;padding:8px;align-items:center;gap:7px;max-width:94%;overflow:auto}#studentTools.open{display:flex}#studentTools button{border:1px solid #e6ceae;border-radius:9px;background:#fff;color:#592c43;padding:8px;font-weight:bold;white-space:nowrap;min-width:42px}#studentTools input[type=color]{width:36px;height:36px;border:0;background:transparent}#studentTools input[type=range]{width:85px;accent-color:#772842}#studentTools label{white-space:nowrap;color:#5f3047;font-size:13px}#studentTools button.active{background:#e4b26b}#conceptLayer{display:none;position:absolute;inset:0;z-index:2;pointer-events:none}#conceptLayer.open{display:block}#conceptSvg{width:100%;height:100%}#conceptCaption{position:absolute;bottom:20px;left:4%;right:4%;text-align:center;color:#60283f;font-size:clamp(16px,2.7vw,32px);font-weight:900;background:#fff9ecea;padding:12px;border-radius:16px}#conceptSvg .interactive{pointer-events:all;cursor:grab}#conceptSvg text{font-family:var(--font)}
@media(max-width:700px){#shell{padding:8px 7px calc(8px + env(safe-area-inset-bottom));gap:7px}#artboard{border-width:3px;border-radius:14px}#toolbar{border-radius:12px;gap:4px;padding:5px;min-height:53px}#toolbar button{min-height:43px;padding:8px 9px;font-size:12px}#micBtn{min-width:40px!important;width:40px!important}#micBtn svg{width:21px;height:21px}#sendBtn{padding:0 8px!important}#command{height:43px;padding:0 9px;font-size:14px}#toolbar .toolText{display:none}#toolbar button.tool svg{width:22px;height:22px}#lessonHud{top:7px;inset-inline:8px;gap:4px}#status{top:auto;bottom:8px;left:10px;right:auto}#lessonHint{bottom:44px}#sceneTitle,#stepBadge,.hudBtn{padding:6px 8px;border-radius:8px}#studentTools{bottom:7px}#toast{bottom:75px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0.001ms!important;transition-duration:0.001ms!important;scroll-behavior:auto!important}}
#micMeter{height:22px;background:#e9dac9;border-radius:30px;overflow:hidden;border:1px solid #cfb5a2;margin:12px 0}#micMeterFill{height:100%;width:0%;transition:width .12s ease-out;background:linear-gradient(90deg,#328971,#95c76c,#e4b65c)}.micNote{border-right:4px solid #a36d68;background:#f8eddf;padding:12px 14px;border-radius:10px;margin:12px 0;line-height:1.8}.micCode{direction:ltr;unicode-bidi:isolate;font:800 14px monospace;color:#943852}
@media(prefers-reduced-motion:reduce){#micMeterFill{transition:none}}
/* ===== v1.1 : واجهة احترافية ===== */
:root{--font:'Tajawal',Tahoma,'Segoe UI',Arial,sans-serif;--display:'Reem Kufi','Tajawal',Tahoma,sans-serif}
#modalTitle,#sceneTitle,.quizTitle,.wTitle{font-family:var(--display)}
#artboard{border-width:4px;border-color:rgba(236,205,150,.55);box-shadow:0 22px 55px rgba(21,0,10,.42),inset 0 0 0 1px #eee0ce}
#spoken{inset:auto 0 clamp(54px,9%,84px) 0;font-size:clamp(17px,2.5vw,36px);padding:0 4%;line-height:1.5}
#spoken span{background:rgba(88,21,45,.93);color:#fff8ea;text-shadow:none;padding:.28em .8em;border-radius:999px;box-shadow:0 8px 24px #3a0b1c44}
#sceneTitle{background:linear-gradient(135deg,#7a2444,#531126)}
.hudBtn{box-shadow:0 2px 6px #4c122118;transition:background .15s,transform .1s}.hudBtn:active{transform:scale(.96)}
#toolbar{backdrop-filter:blur(8px);background:rgba(45,8,25,.72)}
#toolbar button{transition:background .15s,transform .1s}#toolbar button:active{transform:scale(.95)}
#command{font-weight:500}#command::placeholder{color:#a58a84}
#micBtn.on{box-shadow:0 0 0 4px #2aaa7e44;animation:micGlow 1.6s infinite}
@keyframes micGlow{50%{box-shadow:0 0 0 9px #2aaa7e1c}}
#modal{border:1px solid #ecd9bd}
.tile{box-shadow:0 2px 8px #6b33431a}
/* اللوحة: عناصر قابلة للتحريك */
#sceneLayer .blk{cursor:grab}#sceneLayer .blk.drag{cursor:grabbing}
#sceneLayer .hit{pointer-events:all;stroke:none}
#sceneLayer .blk.sel .hit{stroke:#d9a95a;stroke-width:2.5;stroke-dasharray:9 7;vector-effect:non-scaling-stroke}
#sceneLayer.locked .blk{cursor:default}
/* شاشة الترحيب */
#welcome{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8vh,20px);padding:4% 5% 5%;text-align:center;color:#58152d;background:radial-gradient(ellipse 70% 60% at 50% 38%,#fffdf6 0%,rgba(255,250,240,0) 75%)}
#welcome.hidden{display:none}
.wMark{width:clamp(110px,22vh,230px);height:auto;filter:drop-shadow(0 8px 14px #58152d2e)}
.wTitle{margin:0;font-size:clamp(28px,5.4vw,70px);font-weight:700;line-height:1.25;color:#58152d}
.wSub{margin:0;font-size:clamp(14px,1.9vw,25px);color:#8a5d63;font-weight:500;max-width:34em}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:1000px}
.chip{border:1.5px solid #e4c9a3;background:#fff;color:#64233e;border-radius:999px;padding:9px 18px;font-weight:700;font-size:clamp(13px,1.5vw,20px);box-shadow:0 3px 10px #6b334314;transition:.15s}
.chip:hover{background:#58152d;color:#fff;border-color:#58152d;transform:translateY(-2px)}
.chip.main{background:#58152d;color:#fff;border-color:#58152d}.chip.main:hover{background:#7a2444}
/* المكتبة */
.libHead{font-family:var(--display);color:#64233e;font-size:22px;margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.libHead:after{content:"";flex:1;height:1px;background:#e8d6c1}
.libGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.libCard{position:relative;background:#fff;border:2px solid #ecd7c3;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #6b334314;transition:.15s}
.libCard:hover{border-color:#a3516a;transform:translateY(-3px);box-shadow:0 8px 18px #6b334326}
.libCard .thumb{display:block;width:100%;border:0;background:linear-gradient(#fffdf8,#fbf1e0);padding:10px 10px 4px;cursor:pointer}
.libCard .thumb svg{width:100%;height:92px;display:block}
.libCard .nm{display:block;font-weight:800;color:#4e253a;font-size:16px;padding:4px 6px 9px}
.libCard .addBtn{position:absolute;top:6px;inset-inline-start:6px;width:32px;height:32px;border-radius:50%;border:0;background:#58152d;color:#fff;font-size:20px;font-weight:800;line-height:1;box-shadow:0 2px 6px #0003}
.libCard .addBtn:hover{background:#0b8b6a}
/* المساعدة */
.helpGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.helpBox{background:#fff;border:1px solid #ecd7c3;border-radius:14px;padding:12px 16px}
.helpBox h3{margin:0 0 6px;font-family:var(--display);color:#64233e;font-size:19px}
.helpBox button{display:block;width:100%;text-align:right;border:0;background:#f7ecdc;color:#4e253a;border-radius:9px;padding:7px 11px;margin:5px 0;font-weight:700;font-size:15.5px}
.helpBox button:hover{background:#58152d;color:#fff}
@media(max-width:700px){#spoken{bottom:46px}.libGrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}.libCard .thumb svg{height:70px}.libCard .nm{font-size:13.5px}.chip{padding:7px 12px}#toolbar{overflow-x:auto}}
@media(max-height:520px){.wMark{display:none}.wSub{display:none}}
@media(max-width:900px){#toolbar .toolText{display:none}#toolbar button{padding:8px 11px}#toolbar{gap:6px}}
@media(max-height:480px){#toolbar{min-height:50px;padding:5px}#toolbar button{min-height:40px}#command{height:40px}#micBtn{width:44px!important;min-width:44px}.wTitle{font-size:clamp(22px,7vh,40px)}}
/* ===== v1.2 ===== */
/* كلامي في منتصف الشاشة */
#heard{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:0 5%;pointer-events:none;opacity:0;transform:scale(.96);transition:opacity .22s,transform .22s}
#heard.show{opacity:1;transform:none}
.heardPill{max-width:92%;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,74px);line-height:1.45;color:#fff8ea;background:rgba(58,10,28,.9);padding:.28em .75em;border-radius:.55em;box-shadow:0 18px 50px #2a071566,inset 0 0 0 2px #e9c58a55}
.heardPill.idle,.heardPill.live{font-size:clamp(18px,2.9vw,40px);background:rgba(70,48,56,.62);color:#f3e7dc;box-shadow:none;font-weight:500}
.heardPill .hk{color:#ffffff80;font-size:.62em;vertical-align:middle}.heardPill .hdim{color:#ffffff59;font-size:.62em}
.heardPill .hv{color:#ffd166}.heardPill .he{color:#7ee6c8;text-decoration:underline;text-decoration-thickness:.07em;text-underline-offset:.2em}.heardPill .hr{color:#9bd2ff}.heardPill .hn{color:#ffb3c7}
.heardPill .hc{text-shadow:0 0 .5em #ffffff66,0 1px 0 #0006;-webkit-text-stroke:.6px #ffffffaa}
.heardPill.idle span,.heardPill.live span{color:inherit!important;text-decoration:none;font-size:1em;-webkit-text-stroke:0;text-shadow:none}
/* خطوات الرسم */
#stepper{display:inline-flex;align-items:center;gap:0;background:#fffaf0f2;border:1.5px solid #ead4b4;border-radius:999px;padding:5px 12px;box-shadow:0 3px 12px #4c122118}
.stp{display:inline-flex;align-items:center;gap:7px;color:#b19a93;font-weight:800;white-space:nowrap}
.stp b{width:clamp(26px,2.6vw,36px);height:clamp(26px,2.6vw,36px);border-radius:50%;display:grid;place-items:center;background:#f1e3d2;color:#9c7f77;font-size:clamp(13px,1.3vw,18px);transition:.25s}
.stp i{font-style:normal;display:none;font-size:clamp(12px,1.25vw,17px)}
.stp.done b{background:#0b8b6a;color:#fff}.stp.cur{color:#58152d}.stp.cur b{background:#8a1538;color:#fff;box-shadow:0 0 0 5px #8a153826;animation:stpPulse 1.5s infinite}.stp.cur i{display:inline}
.stpLine{width:clamp(12px,2vw,30px);height:3px;background:#ead4b4;margin:0 6px;border-radius:2px}.stp.done+.stpLine{background:#0b8b6a}
@keyframes stpPulse{50%{box-shadow:0 0 0 10px #8a153812}}
#stepIntro{position:absolute;top:clamp(62px,11%,96px);left:50%;z-index:7;display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#fffdf6,#fbeed6);border:2px solid #e6c896;border-radius:22px;padding:12px 26px 12px 20px;box-shadow:0 16px 40px #3a0b1c33;color:#58152d;pointer-events:none;opacity:0;transform:translate(-50%,-26px) scale(.92);transition:opacity .3s,transform .45s cubic-bezier(.2,1.4,.4,1)}
#stepIntro.show{opacity:1;transform:translate(-50%,0)}
#stepIntro b{width:clamp(46px,5.2vw,74px);height:clamp(46px,5.2vw,74px);border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#a3284f,#58152d);color:#fff;font-family:var(--display);font-size:clamp(24px,3vw,42px);box-shadow:0 6px 16px #58152d55}
#stepIntro span{display:flex;flex-direction:column;gap:2px;text-align:right}#stepIntro strong{font-family:var(--display);font-size:clamp(18px,2.4vw,34px)}#stepIntro em{font-style:normal;color:#8a5d63;font-size:clamp(13px,1.5vw,21px)}
/* بطاقات الأسئلة */

اسم الأوروبي للزخرفة النباتية الإسلامية المتشابكة."], ["ما الفرق بين الزخرفة الهندسية والنباتية؟", "الهندسية تعتمد الخطوط والأشكال كالمربع والنجمة، والنباتية تعتمد الأوراق والسيقان المتشابكة."], ["ما المواد التي نُفّذت عليها الزخارف الإسلامية؟", "الجص والخشب والخزف والزجاج والمعادن والسجاد والمخطوطات."], ["ما هو التجريد في الفن الإسلامي؟", "تحويل الأشكال الواقعية إلى أشكال مبسّطة ورموز بعيدة عن المحاكاة."]]}, {"name": "العمارة الإسلامية", "keys": ["العماره", "عماره", "معماري", "المباني"], "qs": [["ما أبرز عناصر العمارة الإسلامية؟", "القبة، والمئذنة، والأقواس، والمحراب، والصحن، والمشربية."], ["ما وظيفة القبة؟", "تغطية المساحات الواسعة، وتعزيز انتشار الصوت والضوء، ولها رمز جمالي للسماء."], ["ما وظيفة المئذنة؟", "يُرفع منها الأذان، وهي علامة مميزة للمسجد في المدينة."], ["ما هو المحراب؟", "تجويف في جدار القبلة يحدد اتجاه الكعبة ويقف أمامه الإمام."], ["ما هي المشربية؟", "نافذة خشبية مخرّمة تُدخل الهواء والضوء وتحفظ خصوصية البيت."], ["ما هو البَرجيل ولماذا استُخدم في قطر؟", "ملقف هواء يُبرّد البيت طبيعياً بالتقاط الهواء من الأعلى، بسبب حرارة الجو."], ["من أشهر المباني التراثية في قطر؟", "قلعة الزبارة، وقلعة الكوت (الدوحة)، وبرج برزان، وسوق واقف."], ["ما المواد التي بُنيت بها البيوت القطرية قديماً؟", "الحجر البحري والجص (الصاروج) وجذوع النخيل والخشب (الدنچل)."], ["ما هو الصحن في المسجد؟", "الساحة المكشوفة وسط المسجد تحيط بها الأروقة."], ["ما هي المقرنصات؟", "حليات معمارية تشبه خلايا النحل تزيّن أسفل القباب والأقواس وتنقل الشكل من المربع إلى الدائرة."], ["ما هو الليوان؟", "ممر مسقوف مفتوح على الفناء يحمي من الشمس والمطر."], ["لماذا كانت نوافذ البيوت القطرية صغيرة وعالية؟", "لتقليل دخول حرارة الشمس وحفظ خصوصية البيت."], ["ما أشهر معالم الدوحة التي تجمع القديم والحديث؟", "سوق واقف ومتحف الفن الإسلامي وحي كتارا الثقافي."]]}, {"name": "الخط العربي", "keys": ["الخط", "خط عربي", "الخط العربي", "خطوط", "الكتابه"], "qs": [["ما هو الخط العربي؟", "فن كتابة الحروف العربية بقواعد وجمال، وهو من أرقى الفنون الإسلامية."], ["اذكر أشهر أنواع الخط العربي.", "الكوفي، والنسخ، والثلث، والرقعة، والديواني، والفارسي، والإجازة."], ["ما الخط الأقدم؟", "الخط الكوفي، ويمتاز بالزوايا والاستقامة، وكُتبت به المصاحف الأولى."], ["ما الخط المستخدم في طباعة الكتب والمصاحف؟", "خط النسخ، لوضوحه وسهولة قراءته."], ["ما الخط الذي نكتب به عادةً بسرعة؟", "خط الرقعة، وهو أسهل الخطوط وأسرعها في الكتابة اليومية."], ["ما أدوات الخطاط؟", "القلم (القصبة أو البوص)، والحبر، والمِقطّة، والورق المصقول."], ["من أشهر الخطاطين في التاريخ الإسلامي؟", "ابن مقلة، وابن البوّاب، وياقوت المستعصمي."], ["كيف يصبح الخط زخرفة؟", "بتكرار الكلمات وتشابكها وتكوينها في أشكال هندسية، كما في الزخرفة الكتابية."], ["ما الخط المستخدم في العناوين والمساجد؟", "خط الثلث، لجلاله وجمال تداخل حروفه."], ["ما الخط الذي يكثر في الوثائق الرسمية العثمانية؟", "الخط الديواني، بانحناءاته المتصلة."], ["ما الفرق بين الكوفي والنسخ؟", "الكوفي مستقيم بزوايا حادة، والنسخ ليّن بانحناءات واضحة وسهل القراءة."], ["ما المقصود بقياس القلم في الخط؟", "وحدة قياس بالنقطة المعيّنة تحدد نسب الحرف وطوله."], ["كيف نحافظ على فن الخط العربي؟", "بتعلّمه وممارسته وزيارة معارضه وتوظيفه في التصميم الحديث."]]}, {"name": "الفنانون القطريون", "keys": ["الفنانين", "فنان", "فنانين", "الفنانون", "التشكيليين"], "qs": [["من هو جاسم زيني؟", "من روّاد الفن التشكيلي في قطر، اهتم برسم البيئة المحلية والبحر والغوص والحياة الشعبية."], ["من هو يوسف أحمد؟", "فنان قطري معروف بأعماله المستوحاة من الخط العربي وورق البردي والحروفية."], ["من هو علي حسن؟", "فنان قطري بارز في الفن الحروفي، يوظّف الحرف العربي كعنصر تشكيلي."], ["ما هي الحروفية في الفن؟", "اتجاه فني يستخدم الحرف العربي كعنصر جمالي في اللوحة لا كنص للقراءة فقط."], ["أين يمكن مشاهدة أعمال الفنانين القطريين؟", "متحف: المتحف العربي للفن الحديث، ومتحف الفن الإسلامي، والصالات الفنية في كتارا."], ["ما الموضوعات التي رسمها الفنانون القطريون؟", "البحر والغوص والصحراء والخيمة والعمارة الشعبية والتراث والخط العربي."], ["ما دور الفنان في حفظ التراث؟", "يوثّق عناصر التراث في أعماله فيحفظها للأجيال ويعرّف العالم بهويته."], ["ما هو المتحف العربي للفن الحديث؟", "متحف في الدوحة يضم أعمالاً عربية حديثة ومعاصرة، ومنها أعمال فنانين قطريين."], ["ما دور كتارا في دعم الفن؟", "حي ثقافي فيه صالات عرض ومسارح وورش تدعم الفنانين وتقيم المعارض."], ["ما الخامات التي يستخدمها الفنانون القطريون؟", "الألوان الزيتية والأكريليك والورق المصنوع يدوياً والطباعة والتصوير والتركيب."], ["لماذا يرسم كثير من الفنانين القطريين البحر؟", "لأن البحر كان مصدر الرزق والغوص والسفر، فهو جزء من ذاكرة المكان."], ["كيف نصبح فنانين؟", "بالممارسة اليومية والرسم من الملاحظة ودراسة أعمال الآخرين والمشاركة في المعارض."]]}, {"name": "الألعاب الشعبية القطرية", "keys": ["الالعاب", "العاب شعبيه", "لعبه", "الالعاب الشعبيه"], "qs": [["ما هي الألعاب الشعبية؟", "ألعاب توارثها الأبناء عن الآباء، تُلعب بأدوات بسيطة من البيئة وفي الأحياء والفرجان."], ["اذكر أشهر الألعاب الشعبية القطرية.", "الدحروي، وطاق طاق طاقية، وعظيم سرحان، والخشيشة، وأم الدرايس، والصقلة."], ["ما فائدة الألعاب الشعبية؟", "تقوّي الجسم وتنمّي التعاون والذكاء وتربط الأجيال بتراثهم."], ["كيف نستفيد من الألعاب الشعبية في الفن؟", "نرسم مشاهدها ونصمّم منها وحدات زخرفية وملصقات تُعرّف بها."], ["بماذا تختلف ألعاب الأمس عن ألعاب اليوم؟", "ألعاب الأمس حركية جماعية بأدوات بسيطة، وألعاب اليوم غالباً إلكترونية فردية."], ["كيف تُلعب «طاق طاق طاقية»؟", "يجلس اللاعبون في دائرة، ويدور أحدهم خلفهم ويضع منديلاً خلف أحدهم ليطارده."], ["ما هي «الخشيشة»؟", "لعبة شعبية تعتمد على تحريك أداة صغيرة تُصدر صوتاً، وتُلعب في الفرجان."], ["متى كانت تُلعب الألعاب الشعبية؟", "بعد العصر وفي المساء وفي الأعياد والمناسبات، في ساحات الفرجان."], ["ما العلاقة بين اللعبة الشعبية والفن؟", "كلاهما تعبير عن ثقافة المجتمع، ويمكن تحويل مشاهد اللعب إلى لوحات وتصاميم."], ["ما هي «القرنقعوه»؟", "مناسبة شعبية في منتصف رمضان يتجوّل فيها الأطفال بملابس تراثية ويجمعون الحلوى والمكسّرات."]]}, {"name": "التراث القطري", "keys": ["التراث", "تراث", "تراثنا", "التراث القطري"], "qs": [["ما المقصود بالتراث؟", "كل ما ورثناه عن الآباء والأجداد من عادات وحرف وفنون ومبانٍ وقيم."], ["ما أنواع التراث؟", "تراث مادي (مبانٍ وأدوات) وتراث غير مادي (عادات وحرف وأهازيج وألعاب)."], ["ما هو السَّدو؟", "حرفة نسيج بدوية من صوف الغنم ووبر ا const circ=(cx,cy,r)=>`M${cx-r} ${cy}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0Z`;
const polar=(cx,cy,r,a)=>`${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)}`;
const rays=(cx,cy,r1,r2,n,w)=>{let d='';for(let i=0;i<n;i++){const a=i*2*Math.PI/n,l=i%2?r1+(r2-r1)*.6:r2;d+=`M${polar(cx,cy,r1,a-w)}L${polar(cx,cy,l,a)}L${polar(cx,cy,r1,a+w)}Z`}return d};
const petals=(cx,cy,r0,r1,n,w,off=0)=>{let d='';for(let i=0;i<n;i++){const a=off+i*2*Math.PI/n;d+=`M${polar(cx,cy,r0,a)}Q${polar(cx,cy,r1*.8,a-w)} ${polar(cx,cy,r1,a)}Q${polar(cx,cy,r1*.8,a+w)} ${polar(cx,cy,r0,a)}Z`}return d};
const zig=(x0,x1,yBase,yTip,n)=>{const w=(x1-x0)/n;let d='';for(let i=0;i<n;i++)d+=`M${x0+i*w} ${yBase}L${x0+i*w+w/2} ${yTip}L${x0+(i+1)*w} ${yBase}Z`;return d};
const diamonds=(x0,x1,cy,h,n,k=1)=>{const w=(x1-x0)/n;let d='';for(let i=0;i<n;i++){const cx=x0+i*w+w/2;d+=`M${cx-w/2*k} ${cy}L${cx} ${cy-h*k}L${cx+w/2*k} ${cy}L${cx} ${cy+h*k}Z`}return d};
const toP=(x,c,w)=>Array.isArray(x)?P(x[0],x[1]||c,x[2]||w):P(x,c,w);

function answerCard(ci,oi){const c=st.cards[ci];if(!c)return;c.pick=oi;renderCards();if(c.opts[oi].ok){chime();announce('إجابة صحيحة، أحسنت!',1300)}else announce('حاول مرة أخرى',1000)}
function renderCards(fresh=0){const L=$('#cardLayer'),n=st.cards.length;L.classList.toggle('open',n>0&&!st.cardsHidden&&st.mode==='normal');L.dataset.n=n;
 L.innerHTML=st.cards.map((c,i)=>`<article class="qcard${i>=n-fresh?' fresh':''}${c.lit?' lit':''}" style="--i:${i}"><header><b>${i+1}</b><span>${escapeHtml(c.topic)}</span><button type="button" class="qx" data-card-del="${i}" aria-label="احذف البطاقة">×</button></header><h3>${escapeHtml(c.q)}</h3><div class="qopts">${c.opts.map((o,k)=>`<button type="button" data-card="${i}" data-opt="${k}" class="${(c.lit&&o.ok)||(c.pick===k&&o.ok)?'right':c.pick===k?'wrong':''}"><i>${LETTERS[k]}</i>${escapeHtml(o.t)}</button>`).join('')}</div></article>`).join('')}
$('#cardLayer').addEventListener('click',e=>{const d=e.target.closest('[data-card-del]');if(d)return removeCards(+d.dataset.cardDel);const o=e.target.closest('[data-card]');if(o)answerCard(+o.dataset.card,+o.dataset.opt)});

const VERB_RE=/^[وف]?(ارسم|ارسمي|ارسمها|ارسملي|سوي|تكلم|حدثنا|عرف|اغلق|اعد|اضف|اضيف|ضيف|زد|لون|لوني|اصبغ|احذف|امسح|شيل|ازل|حرك|انقل|كبر|صغر|اقلب|اعكس|كرر|انسخ|ضع|حط|خل|خلي|اجعل|تراجع|اشرح|اعمل|هات|اظهر|اخف|اخفي|شغل|اوقف|ثبت|فعل|اختبار|موقت|مؤقت)$/;
const REL_RE=/^(علي|فوق|تحت|اسفل|اعلي|يمين|يسار|بجانب|جنب|جانب|امام|قدام|خلف|وراء|داخل|وسط|في|عن)$/;
const KEY_RE=/^(طيب|طيبه|طب)$/;
function showHeard(text,{live=false,request=true,ms=2000}={}){const box=$('#heard');if(!box)return;const words=String(text||'').trim().split(/\s+/).filter(Boolean).slice(-14);if(!words.length)return;
 const nws=words.map(w=>normalize(w).replace(/\s/g,''));let pos=0;const starts=nws.map(w=>{const s=pos;pos+=w.length+1;return s});const ms2=findScenes(nws.join(' '));
 let html='';const keyIdx=nws.map(w=>KEY_RE.test(w)).lastIndexOf(true);
 words.forEach((w,i)=>{const nw=nws[i];let cls='',style='';const col=nw&&findColor(nw);
  if(i===keyIdx)cls='hk';else if(keyIdx>=0&&i<keyIdx)cls='hdim';
  else if(ms2.some(m=>starts[i]>=m.pos&&starts[i]<m.end)||/^(ال)?(بطاقه|بطاقات|بطاقتين|خلفيه|الجواب|الاجابه)$/.test(nw))cls='he';
  else if(col){cls='hc';style=` style="color:${col}"`}
  else if(VERB_RE.test(nw))cls='hv';else if(REL_RE.test(nw))cls='hr';else if(/^\d+$/.test(nw)||NUMS[nw])cls='hn';
  html+=`<span class="${cls}"${style}>${escapeHtml(w)}</span> `});
 box.innerHTML=`<div class="heardPill${live?' live':''}${request?'':' idle'}">${html}</div>`;box.classList.add('show');clearTimeout(box._t);box._t=setTimeout(()=>box.classList.remove('show'),live?1800:ms)}

// الممحاة باليد: كل لمسة تُضاف إلى قناع العنصر الذي تمرّ فوقه
let rubbing=null,rubRaf=0;
function rubAt(e){const p=svgPoint(e);for(const b of st.blocks){const r=rectOf(b);if(p.x<r.left-24||p.x>r.right+24||p.y<r.top-24||p.y>r.bottom+24)continue;const t=tf(b),x=((p.x-t.tx)/t.sx).toFixed(1),y=((p.y-t.ty)/t.sy).toFixed(1);let s=rubbing.strokes.get(b.id);if(!s){s={d:`M${x} ${y}l.1 0`,w:Math.round(38/b.scale)};(b.rub=b.rub||[]).push(s);rubbing.strokes.set(b.id,s)}else s.d+=`L${x} ${y}`}
 if(!rubRaf)rubRaf=requestAnimationFrame(()=>{rubRaf=0;render()})}
svg.addEventListener('pointerdown',e=>{if(st.tool!=='eraser'||st.mode!=='normal'||!st.blocks.length)return;e.preventDefault();stopAnimation();pushHistory();st.blocks.forEach(b=>b.step=3);rubbing={strokes:new Map(),id:e.pointerId};try{svg.setPointerCapture(e.pointerId)}catch(err){}rubAt(e)});
svg.addEventListener('pointermove',e=>{if(rubbing&&e.pointerId===rubbing.id)rubAt(e)});
const endRub=()=>{if(rubbing){rubbing=null;render()}};svg.addEventListener('pointerup',endRub);svg.addEventListener('pointercancel',endRub);
$('#eraserTool').addEventListener('click',()=>setTool(st.tool==='eraser'?null:'eraser'));

// ===== لوحة الشرح: رسم + ألوان + حقائق تُقرأ بالصوت =====
function speakThen(text,next){let done=false;const go=()=>{if(done)return;done=true;clearTimeout(tm);next()};let tm=setTimeout(go,text.length*130+3500);
 if(!st.voiceReply||!('speechSynthesis' in window)){clearTimeout(tm);tm=setTimeout(go,1300+text.length*55);return}
 try{const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';const v=speechSynthesis.getVoices().find(x=>/^ar/i.test(x.lang));if(v){u.voice=v;u.lang=v.lang}u.rate=.95;st.ttsUntil=Date.now()+Math.min(16000,text.length*130+2500);u.onend=u.onerror=()=>{st.ttsUntil=Date.now()+450;setTimeout(go,260)};speechSynthesis.speak(u)}catch(e){go()}}
function narrate(){const P=$('#topicPanel'),items=[...P.querySelectorAll('.tpFacts li')],tp=st.topic;if(!tp)return;const token=++st.narr;st.narrating=true;try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
 items.forEach(li=>li.classList.remove('on','cur'));let i=-1;
 const step=()=>{if(token!==st.narr||st.topic!==tp)return;i++;items.forEach((li,k)=>{li.classList.toggle('on',k<=i);li.classList.toggle('cur',k===i)});if(i>=items.length){st.narrating=false;P.classList.add('done');return}const li=items[i];li.scrollIntoView&&li.scrollIntoView({block:'nearest',behavior:'smooth'});speakThen(li.textContent,step)};
 P.classList.remove('done');speakThen(tp.t,step)}
function closeTopic(){if(!st.topic)return;st.topic=null;st.narr++;st.narrating=false;try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}st.ttsUntil=Date.now()+300;$('#topicPanel').classList.remove('open');$('#conceptSvg').setAttribute('viewBox','0 0 1000 600');$('#conceptCaption').style.visibility='';$('#artboard').classList.remove('topicOn')}
function openTopic(tp){if(!tp)return false;pushHistory();stopTimer();resetVisual();st.cards=[];renderCards();st.blocks=[];st.active=null;st.lesson=false;st.bg=null;$('#lessonHint').classList.remove('visible');$('#stepIntro').classList.remove('show');
 if(tp.concept){render();if(tp.concept==='نسخ')handwriting('نسخ');else createConcept(tp.concept);$('#conceptCaption').style.visibility='hidden'}
 st.topic=tp;
 if(!tp.concept){if(tp.scene&&scenes[tp.scene]){const bb=sceneBox(tp.scene),s=Math.min(1.05,430/bb.w,400/bb.h),b=mk(tp.scene,{cx:265,cy:318,scale:s,step:3});st.blocks=[b];st.active=b.id;enqueue(done=>animateBlock(b,[1,2,3],done,1.25))}else render()}
 const P=$('#topicPanel');P.innerHTML=`<header><h2>${escapeHtml(tp.t)}</h2><button type="button" data-tp="close" aria-label="أغلق الشرح">×</button></header>${(tp.colors||[]).length?`<div class="tpSw">${tp.colors.map(([n,h])=>`<span><i style="background:${h}"></i>${escapeHtml(n)}</span>`).join('')}</div>`:''}<ol class="tpFacts">${tp.facts.map(f=>`<li>${escapeHtml(f)}</li>`).join('')}</ol><footer><button type="button" data-tp="again">🔊 أعد الشرح</button>${tp.quiz?'<button type="button" data-tp="card">بطاقة سؤال</button>':''}${tp.scene?'<button type="button" data-tp="steps">ارسمها خطوة بخطوة</button>':''}</footer>`;
 P.classList.add('open');$('#artboard').classList.add('topicOn');updateHud();narrate();return true}
function sceneTopic(key){const sc=scenes[key];return{t:sc.title,scene:key,facts:[sc.desc],colors:sceneFills(key).filter(f=>(f.o??1)>=.9).slice(0,4).map(f=>['',f.fill])}}
$('#topicPanel').addEventListener('click',e=>{const b=e.target.closest('[data-tp]');if(!b||!st.topic)return;const a=b.dataset.tp,tp=st.topic;if(a==='close'){closeTopic();render()}else if(a==='again')narrate();else if(a==='card'){closeTopic();render();addCards(1,tp.quiz||null)}else if(a==='steps'){const k=tp.scene;closeTopic();drawScene(k,{stepwise:true})}});
async function askAITopic(text){const key=localStorage.getItem('qa-api-key');if(!key)return false;announce('أبحث عن الموضوع…',1500,false);
 try{const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'gpt-4.1-mini',temperature:.2,response_format:{type:'json_object'},messages:[{role:'system',content:'أنت مساعد معلم تربية فنية للصف الخامس والسادس في قطر. أعد JSON فقط بصيغة {"title":"...","facts":["...","...","...","...","..."],"colors":[{"name":"...","hex":"#rrggbb"}]}. خمس جمل عربية قصيرة ودقيقة وبسيطة عن الموضوع، وثلاثة ألوان مرتبطة به. لا تذكر معلومة غير مؤكدة.'},{role:'user',content:text}]})});
  if(!r.ok){toast(r.status===401?'مفتاح الذكاء الاصطناعي مرفوض (401).':'تعذّر جلب الشرح ('+r.status+').');return true}
  const o=JSON.parse((await r.json()).choices?.[0]?.message?.content||'{}'),facts=(o.facts||[]).filter(x=>typeof x==='string').slice(0,6).map(x=>x.slice(0,220));if(!facts.length)throw Error('data');
  const ms=findScenes(normalize(text));openTopic({t:String(o.title||'شرح').slice(0,60),facts,scene:ms[0]&&ms[0].key,colors:(o.colors||[]).filter(c=>c&&/^#[0-9a-f]{6}$/i.test(c.hex)).slice(0,5).map(c=>[String(c.name||'').slice(0,14),c.hex])})}
 catch(e){toast('تعذّر جلب الشرح من الذكاء الاصطناعي.')}return true}

function colorsIn(n){const out=[];for(const w of n.split(' ')){for(const [alts,hex] of COLORS){if(new RegExp('^(?:و|ب|بال|ال|وال|لل)?(?:'+alts+')$').test(w)){const name=alts.split('|')[0];if(!out.some(o=>o[1]===hex))out.push([name,hex])}}}return out}

function ambient(n){let shown=false;const cols=colorsIn(n),tp=findTopic(n),ms=findScenes(n),busyBoard=st.blocks.length>0||st.cards.length>0||st.mode!=='normal';
 if(tp&&(!busyBoard||st.topic)&&tp!==st.topic){openTopic(tp);return true}
 if(cols.length>=2||(cols.length===1&&/(لون|الوان)/.test(n))){showSwatches(cols);shown=true}
 if(tp&&tp!==st.topic){showMention({title:tp.t,key:tp.scene,line:tp.facts[0],tp});shown=true}
 else if(!tp&&ms.length){const k=ms[0].key;if(!st.blocks.some(b=>b.key===k)){showMention({title:scenes[k].title,key:k,line:scenes[k].desc});shown=true}}
 return shown}

const DOM3={cog:{n:'معرفي',c:'#1f5f9c',v:['يتعرف','يعرف','يذكر','يعدد','يميز','يشرح','يسمي','يحدد','يقارن','يصف','يفهم','يستنتج','يوضح','يكتشف','يلاحظ']},

function subjectOf(raw,t){
  for(const a of ARTISTS)if(a.res.some(r=>r.test(t)))return {name:'الفنان '+a.name,ref:'قلم',artist:a,fact:a.facts[0]};
  if(/(?:^| )(?:ال)?سوق(?= |$)/.test(t))return {name:'سوق واقف',ref:'t_souq',fact:'سوق الدوحة التراثي بأزقته ومحلاته وجدرانه الطينية.'};
  const n=M.normalize(raw),tp=M.findTopic(n),ms=M.findScenes(n);
  if(ms.length)return {name:M.scenes[ms[0].key].title,ref:ms[0].key,fact:tp?tp.facts[0]:''};
  const pc=findPic(t);
  if(pc)return {name:pc.title,ref:pc.id,fact:pc.note||(tp?tp.facts[0]:'')};
  if(tp)return {name:tp.t,ref:tp.scene&&M.scenes[tp.scene]?tp.scene:'كتاب',fact:tp.facts[0]};
  return null;
}
function objectiveCmd(raw,t){
  const m=/(?:^| )ان (ي\S+)/.exec(t);
  if(m){
    let d=null;for(const [id,o] of Object.entries(DOM3))if(o.v.some(v=>m[1].startsWith(v)))d=id;
    if(d){
      const ri=raw.search(/[أا]ن\s+ي/),text=(ri>=0?raw.slice(ri):raw).trim().replace(/[.،]+$/,'')+'.',sub=subjectOf(raw,t);
      objs.forEach(o=>o.hot=false);
      objs.push({d,text:text.replace(/^ان/,'أن'),thumb:thumb(sub?sub.ref:(d==='skill'?'قلم':d==='aff'?'قلب':'كتاب')),fact:sub?sub.fact:'',hot:true});
      if(objs.length>4)objs.shift();
      if(sub&&sub.artist)showArtist(sub.artist);
      renderObjs();return true;
    }
  }
  if(!/اهداف|هدف/.test(t))return false;
  if(ERASE.test(t)||CLOSE.test(t)){if(/اهداف|كل/.test(t))objs.length=0;else objs.pop();renderObjs();return true;}
  const only=t.includes('معرفي')?'cog':t.includes('مهاري')?'skill':t.includes('وجداني')?'aff':null;
  let sub=subjectOf(raw,t);
  if(!sub&&place)sub={name:place.name,ref:place.thumb,fact:''};
  if(!sub&&M.st.blocks.length){const b=M.st.blocks[M.st.blocks.length-1];sub={name:M.scenes[b.key].title,ref:b.key,fact:''};}
  if(!sub&&objs.length&&only){objs.forEach(o=>o.hot=o.d===only);renderObjs();return true;}
  if(!sub)sub={name:'موضوع الدرس',ref:'كتاب',fact:''};
  const X=sub.name,art=!!sub.artist;
  const set=[
    {d:'cog',text:art?`أن يتعرّف الطالب على ${X} وأسلوبه في الرسم.`:`أن يتعرّف الطالب على ${X}.`,thumb:thumb(sub.ref),fact:sub.fact||''},
    {d:'skill',text:art?`أن يرسم الطالب لوحة مستوحاة من أسلوب ${X}.`:`أن يرسم الطالب ${X} بخطوط وأشكال بسيطة ثم يلوّنها.`,thumb:thumb('قلم'),fact:''},
    {d:'aff',text:art?`أن يتذوّق الطالب جمال لوحات ${X} ويقدّر الفن.`:`أن يتذوّق الطالب جمال ${X} ويعتزّ بتراث وطنه.`,thumb:thumb('قلب'),fact:''}];
  objs.length=0;set.forEach(o=>{o.hot=only?o.d===only:false;objs.push(o);});
  if(sub.artist)showArtist(sub.artist);
  renderObjs();return true;
}

 ['في منظور النقطة الواحدة، أين تلتقي الخطوط المائلة؟',['في نقطة التلاشي','في زاوية الورقة','لا تلتقي أبداً'],0],['على أي خط تقع نقطة التلاشي؟',['خط الأفق','خط الأرض','حافة الورقة'],0],
 ['كيف تبدو الأشياء البعيدة في المنظور؟',['أصغر من القريبة','أكبر من القريبة','بالحجم نفسه'],0],['ما الألوان الغالبة على مباني السوق؟',['ألوان الرمل والطين الدافئة','الأزرق والأخضر','الأسود والرمادي'],0]]);
addQ('قلعة الزبارة',[['في أي عام بُنيت قلعة الزبارة؟',['1938','1838','2013'],0],['كم برجاً للقلعة؟',['أربعة: ثلاثة دائرية وواحد مستطيل','برجان دائريان','ستة أبراج مربعة'],0],['ما الشكل الهندسي لمسقط القلعة؟',['المربع','الدائرة','المثلث'],0],
 ['متى أُدرجت الزبارة في قائمة التراث العالمي لليونسكو؟',['2013','1938','1999'],0],['لماذا بُنيت الأسوار سميكة وعالية؟',['للحماية وللبرودة في الداخل','للزينة فقط','لتخزين الماء'],0]]);
addQ('الزخارف الإسلامية',[['ما أنواع الزخرفة الإسلامية؟',['هندسية ونباتية وكتابية','مائية وزيتية','قديمة وحديثة فقط'],0],['ما الأدوات التي نرسم بها الزخرفة الهندسية؟',['المسطرة والفرجار','الإسفنج والماء','المقص والصمغ'],0],
 ['ما الاسم الآخر للزخرفة النباتية؟',['التوريق','التنقيط','التظليل'],0],['ممّ تتكوّن الزخرفة النباتية؟',['سيقان وأوراق وأزهار','مربعات ومثلثات','حروف وكلمات'],0]]);
function resolve(text,core){
  const t=norm(text);
  if(/(?:^| )(?:ال)?سوق(?= |$)/.test(t))return 'سوق واقف';
  if(/زباره|قلعه/.test(t))return 'قلعة الزبارة';
  if(/محمل|محامل|سفن|مراكب/.test(t))return 'المحامل التقليدية';
  if(/الغاز|لغز|صوره/.test(t))return 'سؤال وصورة';
  if(/الوان|لون|فنون بصريه/.test(t))return 'اختبار الفنون البصرية';
  return core||(place?place.topic:null);
}

/* ---------- التقاط الأوامر الجديدة قبل أوامر المرسم ---------- */
const CARDW=/بطاق|سوال|اسيل|جواب|اجاب|اختبار|تقييم/;
const ERASE=/(?:^| )(?:امح\S*|امسح\S*|احذف\S*|شيل\S*|ازل\S*|ازيل\S*|اشطب\S*|الغ\S*)(?= |$)/;
const CLOSE=/(?:^| )(?:اغلق\S*|اقفل\S*|سكر\S*|اخف\S*|كفي|خلاص)(?= |$)/;
const DRAW=/(?:^| )(?:و|ف)?(?:ارسم\S*|نرسم|اضف\S*|اضيف\S*|ضيف\S*|زد|زيد\S*|حط\S*|هات\S*|اعرض\S*|اظهر\S*|سوي\S*|ورني|ورينا)(?= |$)/;
const OTHERVERB=/(?:^| )(?:زين\S*|زخرف|زخرفي|لون\S*|ضع|خل|خلي|اجعل\S*|كبر\S*|صغر\S*|حرك\S*|انقل|كرر\S*|انسخ|اقلب|اعكس)(?= |$)/;
let lastT='',lastAt=0;
function anyOpen(){return ['xObjs','xArtist','xPic','xBoard'].some(id=>$(id).classList.contains('show'));}
function closeAll(){objs.length=0;renderObjs();closeArtist();closePic();closeBoard();}
function pre(raw,opt){
  const t=norm(raw);if(!t)return false;
  const tokens=t.split(' '),done=()=>{M.showHeard(String(raw).trim());return true;};
  if(opt.voice){const now=Date.now();if(t===lastT&&now-lastAt<1800)return true;lastT=t;lastAt=now;}
  if(CARDW.test(t))return false;
  if(/امسح الشاشه|امسح الكل|امسح كل|احذف الكل|احذف كل|لوحه نظيفه|لوحه جديده|ابدا من جديد/.test(t)||t==='امسح'||t==='مسح'){closeAll();closePlace();return false;}
  if(objectiveCmd(raw,t))return done();
  if(CLOSE.test(t)&&anyOpen()){
    if(/اهداف|هدف/.test(t)){objs.length=0;renderObjs();}else if(/فنان/.test(t))closeArtist();else if(/صوره|لوحه/.test(t))closePic();else if(/زخارف|زخرف/.test(t))closeBoard();else closeAll();
    return done();
  }
  if(ERASE.test(t)&&/فنان/.test(t)&&$('xArtist').classList.contains('show')){closeArtist();return done();}
  if(ERASE.test(t)&&/صوره|لوحه/.test(t)&&$('xPic').classList.contains('show')){closePic();return done();}
  if(!ERASE.test(t)&&artistCmd(t))return done();
  const verb=DRAW.test(t)||OTHERVERB.test(t)||ERASE.test(t);
  // الزخارف الإسلامية وأنواعها
  const boardOpen=$('xBoard').classList.contains('show');
  if(!verb&&(/زخارف|زخرف/.test(t)||boardOpen||tokens.length<=2)){
    if(/كتابي|خطي/.test(t)&&(boardOpen||/زخارف|زخرف/.test(t))){closeBoard();M.openTopic(M.TOPICS.calligraphy);return done();}
    if(/هندسي/.test(t)){closeBoard();openPlace(PLACES[1],false);return done();}
    if(/نباتي|توريق/.test(t)){closeBoard();openPlace(PLACES[2],false);return done();}
    if(/زخارف|زخرف/.test(t)&&!/سدو/.test(t)){closePlace();showBoard();return done();}
  }
  // سوق واقف بمنظور النقطة الواحدة
  if(/(?:^| )(?:و|ب|في)?(?:ال)?سوق(?= |$)/.test(t)&&!ERASE.test(t)){
    openPlace(PLACES[0],DRAW.test(t)||/منظور/.test(t));
    layersIn(t).forEach(reveal);return done();
  }
  if(place){
    if(ERASE.test(t)&&/سوق|المشهد|المكان|الزخرفه/.test(t)){closePlace();return done();}
    if(/كل التفاصيل|الرسمه كامله|كامله|كاملا/.test(t)){openPlace(place,true);return done();}
    if(tokens.includes('التالي')){const l=place.layers.find(x=>!shown.has(x.id)&&!x.extra)||place.layers.find(x=>!shown.has(x.id));if(l){reveal(l);return done();}}
    const ls=layersIn(t);
    if(ls.length){
      if(ERASE.test(t)){const on=ls.filter(l=>shown.has(l.id));if(on.length){on.forEach(hide);return done();}}
      else if(!OTHERVERB.test(t)||/لون|الوان/.test(t)){ls.forEach(reveal);return done();}
    }
  }
  // اللوحات الجاهزة
  const wantPic=/(?:^| )(?:ال)?(?:لوحه|صوره)(?= |$)/.test(t);
  if(!ERASE.test(t)&&(wantPic||DRAW.test(t)||tokens.length<=2)){
    const pc=findPic(t,wantPic);
    if(pc&&(wantPic||!M.findScenes(M.normalize(raw)).length)){showPic(pc);return done();}
  }
  return false;
}
const fix=raw=>String(raw).replace(/(^|\s)[اإ]مح[يو]?(?=\s|$)/g,'$1امسح');
document.addEventListener('click',e=>{
  const x=e.target.closest('[data-close]');if(x){closeArtist();return;}
  const r=e.target.closest('[data-a]');if(r){showArtist(ARTISTS.find(a=>a.id===r.dataset.a));return;}
  if(e.target.closest('#xPic'))closePic();
  if(e.target.closest('#xBoard'))closeBoard();
});
M.setExt({pre,fix,resolve,clear(){closeAll();closePlace();}});
window.__xt={pre,PLACES,objs,get place(){return place;},shown};
