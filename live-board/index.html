<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{height:auto}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>لوحة الشرح الحي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: one big frameless stage holding a single picture that a pen builds part by part; the named parts sit as chips above it; a fixed dock holds the live caption and the microphone. */
:root{
  --bg:#EDF2F7; --surface:#FFFFFF; --fg:#14233B; --muted:#5A6B85; --line:#CBD6E4;
  --m1:#0E8A7D; --m2:#D6336C; --m3:#B86E00; --m4:#6741D9; --m5:#1C7ED6;
  --live:#D6336C; --ink:#14233B; --good:#2F9E44; --bad:#E8590C;
  --display:"Lalezar","Tajawal","Segoe UI",Tahoma,sans-serif;
  --text:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  --dock-h:170px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B2D; --surface:#18263C; --fg:#EAF1FA; --muted:#9DB0CA; --line:#2B3D58;
    --m1:#3DD6C4; --m2:#FF7AA8; --m3:#FFC14D; --m4:#B197FC; --m5:#6CB8FF;
    --live:#FF7AA8; --ink:#EAF1FA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B2D; --surface:#18263C; --fg:#EAF1FA; --muted:#9DB0CA; --line:#2B3D58;
  --m1:#3DD6C4; --m2:#FF7AA8; --m3:#FFC14D; --m4:#B197FC; --m5:#6CB8FF;
  --live:#FF7AA8; --ink:#EAF1FA; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:17px;line-height:1.6}
.page{
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px calc(var(--dock-h) + 20px);
  max-width:1180px;margin-inline:auto;display:grid;gap:12px;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.2rem;color:var(--muted)}
.state{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.state.on .dot{background:var(--live);animation:pulse 1.2s ease-in-out infinite}
.state.on{color:var(--fg)}
@keyframes pulse{50%{transform:scale(1.6);opacity:.45}}

.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;min-height:36px;justify-content:center}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px 14px 3px 12px;font-weight:700;font-size:.95rem;animation:pop .4s cubic-bezier(.2,.9,.3,1.5) both}
.sw{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);background:var(--pf, transparent);transition:background .6s;flex:none}
@keyframes pop{from{opacity:0;transform:scale(.3)}}

.stage{display:grid;justify-items:center;gap:4px;text-align:center;min-width:0}
.tag{font-size:.85rem;font-weight:700;color:var(--muted);border:1.5px dashed var(--line);border-radius:999px;padding:2px 12px}
.canvas{position:relative;width:min(100%, max(230px, calc(100vh - var(--dock-h) - 270px)));aspect-ratio:1;max-width:100%}
.blob{position:absolute;inset:4%;border-radius:46% 54% 52% 48%/50% 46% 54% 50%;background:var(--surface);animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{border-radius:54% 46% 47% 53%/46% 54% 48% 52%;transform:rotate(8deg)}}
.sk{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.sk path{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:fill .7s}
.sk g.done path.closed{fill:var(--pf, transparent)}
.sk g.wait path{visibility:hidden}
.pen{position:absolute;left:-1px;top:-37px;width:38px;height:38px;pointer-events:none;z-index:2}
.pen path{fill:var(--m3);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.label{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,5.5vw,3.4rem);line-height:1.25;margin:0;color:var(--m5);text-wrap:balance;overflow-wrap:anywhere;min-height:1.25em}
.pending{margin:0;color:var(--muted);font-weight:700}
.pending::after{content:" …";animation:pulse 1.2s infinite;display:inline-block}

.big{position:fixed;inset:0 0 var(--dock-h) 0;z-index:4;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:0 .3em;overflow:hidden;pointer-events:none;text-align:center;
  padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  font-family:var(--display);font-size:clamp(2.4rem,9vw,6rem);line-height:1.25;background:color-mix(in srgb, var(--bg) 82%, transparent);opacity:0;transition:opacity .5s}
.big.on{opacity:1}
.big span{animation:wordIn .28s cubic-bezier(.2,.9,.3,1.6) both;overflow-wrap:anywhere;min-width:0}
.big span:nth-child(5n+1){color:var(--m1)} .big span:nth-child(5n+2){color:var(--m2)}
.big span:nth-child(5n+3){color:var(--m3)} .big span:nth-child(5n+4){color:var(--m4)} .big span:nth-child(5n+5){color:var(--m5)}
.quiz{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:10px;max-width:720px;width:100%;margin-inline:auto;min-width:0}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-weight:700;font-size:.9rem}
.q-top button{padding:5px 14px;font-size:.9rem}
.q-text{font-family:var(--display);font-weight:400;font-size:clamp(1.3rem,3.6vw,2rem);line-height:1.35;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.q-opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.q-opts button{width:100%;text-align:start;border-radius:14px;padding:11px 16px;font-size:1.05rem;overflow-wrap:anywhere}
.q-opts button.good{border-color:var(--good);background:color-mix(in srgb, var(--good) 18%, var(--surface))}
.q-opts button.bad{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 16%, var(--surface))}
.q-fb{margin:0;font-weight:700;min-height:1.6em}

.dock{position:fixed;inset:auto 0 0 0;z-index:5;background:var(--surface);border-top:1.5px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.dock-in{max-width:1180px;margin-inline:auto;display:grid;gap:10px}
.caption{min-height:1.6em;max-height:3.1em;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-end;gap:0 .35em;
  font-size:clamp(1.1rem,2.4vw,1.6rem);font-weight:700;line-height:1.45}
.caption .w{animation:wordIn .28s cubic-bezier(.2,.9,.3,1.6) both}
.caption .w:nth-child(5n+1){color:var(--m1)} .caption .w:nth-child(5n+2){color:var(--m2)}
.caption .w:nth-child(5n+3){color:var(--m3)} .caption .w:nth-child(5n+4){color:var(--m4)} .caption .w:nth-child(5n+5){color:var(--m5)}
.caption .partial{color:var(--muted);font-weight:500}
.caption .hint{color:var(--muted);font-weight:500;font-size:1rem}
@keyframes wordIn{from{opacity:0;transform:translateY(10px) scale(.7)}}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 18px;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--m5);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.mic{background:var(--live);border-color:var(--live);color:var(--surface);padding:11px 24px;font-size:1.05rem}
.mic.on{background:var(--fg);border-color:var(--fg)}
.say{flex:1;min-width:150px;display:flex;gap:8px}
.say input{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px}
.note{font-size:.88rem;color:var(--muted);margin:0}
.keybox{display:grid;gap:8px;font-size:.9rem;color:var(--muted);min-width:0}
.keybox input{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;min-width:0;width:100%}
.keybox .row{display:flex;gap:8px;flex-wrap:wrap}
.keybox .row input{flex:1;min-width:160px;width:auto}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="page" dir="rtl" lang="ar">
  <div class="top">
    <div class="brand">لوحة الشرح الحي</div>
    <div class="state" id="state" role="status" aria-live="polite"><span class="dot"></span><span id="stateText">يجهّز الميكروفون</span></div>
  </div>
  <ul class="chips" id="chips" aria-label="أجزاء الرسمة"></ul>
  <section class="stage" id="stage">
    <div class="canvas" id="canvas">
      <div class="blob"></div>
      <svg class="sk" id="sk" viewBox="0 0 100 100" role="img" aria-label="الرسمة"></svg>
      <svg class="pen" id="pen" viewBox="0 0 26 26" aria-hidden="true" hidden><path d="M1 25l3-9L18 2l6 6L10 22Z"/></svg>
    </div>
    <h1 class="label" id="label"></h1>
    <span class="tag" id="exTag">مثال — جرّب: «لوّن العجلات بالأحمر» أو «ارسم ولداً يركض»</span>
    <p class="pending" id="pending" hidden>القلم يجهّز الرسمة</p>
  </section>
  <section class="quiz" id="quiz" hidden>
    <div class="q-top"><span id="qCount"></span><button id="qClose" type="button">إغلاق الأسئلة</button></div>
    <h2 class="q-text" id="qText"></h2>
    <ol class="q-opts" id="qOpts"></ol>
    <p class="q-fb" id="qFb" role="status"></p>
    <div><button id="qNext" type="button" hidden>التالي</button></div>
  </section>
</div>

<div class="big" id="big" dir="rtl" lang="ar" aria-hidden="true"></div>

<div class="dock" id="dock" dir="rtl" lang="ar">
  <div class="dock-in">
    <div class="caption" id="caption" aria-live="off"><span class="hint">قل ما تريد رسمه، ثم لوّن أي جزء بصوتك: «لوّن العجلات بالأسود»، «السيارة كلها حمراء».</span></div>
    <div class="controls">
      <button class="mic" id="mic" type="button">ابدأ الكلام</button>
      <form class="say" id="sayForm">
        <input id="sayInput" type="text" autocomplete="off" placeholder="أو اكتب الأمر هنا" aria-label="اكتب الأمر">
        <button id="sayBtn" type="submit">نفّذ</button>
      </form>
      <button id="quizBtn" type="button">أسئلة</button>
      <button id="reset" type="button">امسح الشاشة</button>
      <button id="full" type="button">ملء الشاشة</button>
      <button id="keyBtn" type="button" hidden>ربط Claude</button>
    </div>
    <form class="keybox" id="keyForm" hidden>
      <label for="keyInput">مفتاح API من Anthropic. يُحفظ في هذا المتصفح فقط، ولا يُكتب داخل الملف.</label>
      <div class="row">
        <input id="keyInput" type="password" autocomplete="off" placeholder="sk-ant-..." dir="ltr">
        <button type="submit">حفظ</button>
        <button type="button" id="keyDel">حذف المفتاح</button>
      </div>
      <input id="wsInput" type="text" autocomplete="off" dir="ltr" placeholder="wrkspc_... (اختياري)" aria-label="معرّف مساحة العمل، اختياري">
    </form>
    <p class="note" id="note" hidden></p>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const chipsEl=$("chips"), canvasEl=$("canvas"), skEl=$("sk"), penEl=$("pen"),
        labelEl=$("label"), pendingEl=$("pending"), captionEl=$("caption"), micBtn=$("mic"),
        stateEl=$("state"), stateText=$("stateText"), noteEl=$("note"), exTag=$("exTag");
  const NS = "http://www.w3.org/2000/svg";
  const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  const EXAMPLE = {title:"سيارة", parts:[
    {name:"الطريق", fill:"", draw:["M5 73H95"]},
    {name:"الهيكل", fill:"#1C7ED6", draw:["M10 62L10 50Q10 46 14 46L28 46L38 32Q40 30 43 30L64 30Q67 30 69 32L80 46L88 48Q92 49 92 53L92 62Z"]},
    {name:"النوافذ", fill:"#D0EBFF", draw:["M33 46L41 35L52 35L52 46Z","M56 35L65 35L74 46L56 46Z"]},
    {name:"المصباح", fill:"#FAB005", draw:["M87 50H92V55H87Z"]},
    {name:"العجلات", fill:"#343A40", draw:["M30 54a9 9 0 1 1-.1 0Z","M72 54a9 9 0 1 1-.1 0Z"]}
  ]};
  const COLORS = [["احمر","#E03131"],["حمرا","#E03131"],["ازرق","#1C7ED6"],["زرقا","#1C7ED6"],["اخضر","#2F9E44"],["خضرا","#2F9E44"],
    ["اصفر","#FAB005"],["صفرا","#FAB005"],["اسود","#212529"],["سودا","#212529"],["ابيض","#FFFFFF"],["بيضا","#FFFFFF"],
    ["برتقال","#F76707"],["بنفسج","#7048E8"],["وردي","#E64980"],["زهري","#E64980"],["رمادي","#868E96"],["ذهبي","#E0A800"],["بني","#8B5E34"]];

  let board = EXAMPLE, isExample = true;
  let transcript = "", lastPhrase = "", partialEl = null;
  let dict = null, sample = null, listening = false, langFail = false;
  let busy = false, aiOff = false, coolUntil = 0;
  let gen = 0, drawQueue = Promise.resolve();

  function note(msg){ noteEl.textContent = msg || ""; noteEl.hidden = !msg; fitDock(); }
  function setState(txt,on){ stateText.textContent = txt; stateEl.classList.toggle("on", !!on); }
  function fitDock(){ document.documentElement.style.setProperty("--dock-h", $("dock").offsetHeight + "px"); }
  const norm = s => String(s).replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ً-ْ]/g,"");
  const okFill = f => (typeof f==="string" && /^#[0-9a-fA-F]{6}$/.test(f)) ? f : "";

  /* ---------- drawing ---------- */
  function okPath(d){ return typeof d==="string" && d.length>3 && d.length<=400 && /^[MmLlHhVvCcSsQqTtAaZz0-9\s.,\-eE]+$/.test(d); }
  function setPaths(g, ds){
    g.textContent = "";
    ds.forEach(d=>{
      const p=document.createElementNS(NS,"path"); p.setAttribute("d", d);
      if(/[Zz]\s*$/.test(d)) p.setAttribute("class","closed");
      g.appendChild(p);
    });
  }
  function stroke(p, my){
    return new Promise(res=>{
      let L=0; try{ L=p.getTotalLength(); }catch(_){}
      if(!L || !isFinite(L)){ p.style.visibility="visible"; res(); return; }
      p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.style.visibility = "visible";
      const dur = Math.min(1300, Math.max(280, L*7)), t0 = performance.now(), k = canvasEl.clientWidth/100;
      let done=false;
      const end=()=>{ if(done) return; done=true; p.style.strokeDashoffset=0; res(); };
      setTimeout(end, dur+1500);   /* a hidden tab pauses frames */
      (function f(t){
        if(done) return;
        if(my!==gen){ end(); return; }
        const u = Math.min(1, Math.max(0,(t-t0)/dur));
        p.style.strokeDashoffset = L*(1-u);
        try{ const pt=p.getPointAtLength(L*u); penEl.style.transform="translate("+(pt.x*k)+"px,"+(pt.y*k)+"px)"; }catch(_){}
        if(u<1) requestAnimationFrame(f); else end();
      })(t0);
    });
  }
  async function penDraw(g, my){
    if(my!==gen || !g.isConnected || !g.classList.contains("wait")) return;
    penEl.removeAttribute("hidden");
    for(const p of g.querySelectorAll("path")){ if(my!==gen) break; await stroke(p, my); }
    penEl.setAttribute("hidden","");
    g.classList.remove("wait"); g.classList.add("done");
    await new Promise(r=>setTimeout(r, 250));
  }

  /* ---------- board ---------- */
  function render(animate){
    labelEl.textContent = board.title || "";
    exTag.hidden = !isExample;
    const have = new Map();
    skEl.querySelectorAll("g").forEach(g=>have.set(g.dataset.name, g));
    chipsEl.textContent = "";
    board.parts.forEach(part=>{
      let g = have.get(part.name);
      have.delete(part.name);
      const key = part.draw.join("|");
      const fresh = !g || g.dataset.key !== key;
      if(!g){ g = document.createElementNS(NS,"g"); g.dataset.name = part.name; }
      if(fresh){
        g.dataset.key = key; setPaths(g, part.draw);
        g.setAttribute("class", (animate && !still) ? "wait" : "done");
      }
      skEl.appendChild(g);                       /* keeps back-to-front order */
      if(part.fill) g.style.setProperty("--pf", part.fill); else g.style.removeProperty("--pf");
      if(fresh && animate && !still){ const my=gen; drawQueue = drawQueue.then(()=>penDraw(g, my)).catch(()=>{}); }
      const li = document.createElement("li"); li.className = "chip";
      const sw = document.createElement("span"); sw.className = "sw";
      if(part.fill) sw.style.setProperty("--pf", part.fill);
      const nm = document.createElement("span"); nm.textContent = part.name;
      li.append(sw, nm); chipsEl.appendChild(li);
    });
    have.forEach(g=>g.remove());
  }
  function wipe(){
    gen++; board={title:"",parts:[]}; isExample=false;
    skEl.textContent=""; penEl.setAttribute("hidden","");
    render(false);
  }
  function clean(r){
    if(!r || !Array.isArray(r.parts)) return null;
    const parts = [];
    r.parts.slice(0,12).forEach(p=>{
      const name = String(p && p.name || "").slice(0,30).trim();
      if(!name || parts.some(x=>x.name===name)) return;
      let draw = (p && Array.isArray(p.draw) ? p.draw : []).filter(okPath).slice(0,6);
      if(!draw.length){ const o = board.parts.find(x=>x.name===name); if(o) draw = o.draw; }
      if(draw.length) parts.push({name, fill:okFill(p.fill), draw});
    });
    if(!parts.length) return null;
    return {title:String(r.title||"").slice(0,60), parts};
  }
  /* Instant, no Claude needed: "colour the wheels red" on parts already drawn. */
  function localColor(phrase){
    const np = norm(phrase);
    const c = COLORS.find(x=>np.includes(x[0]));
    if(!c || !board.parts.length) return false;
    let hit = board.parts.filter(p=>{
      const w = norm(p.name).replace(/^ال/,"");
      return w.length>=3 && np.includes(w.slice(0, Math.min(4, w.length)));
    });
    if(!hit.length && (/كل|كامل|جميع/.test(np) || !sample || aiOff)) hit = board.parts;
    if(!hit.length) return false;
    board = {title:board.title, parts:board.parts.map(p=>hit.includes(p) ? {name:p.name, fill:c[1], draw:p.draw} : p)};
    render(true);
    return true;
  }
  /* Instant, no Claude needed: a stick figure in a named pose. */
  const POSES = {
    stand:{t:"تقف", head:"M50 15a9 9 0 1 1-.1 0Z", body:["M50 33V60"], arms:["M50 40L36 54","M50 40L64 54"], legs:["M50 60L40 86","M50 60L60 86"]},
    wave:{t:"تلوّح", head:"M50 15a9 9 0 1 1-.1 0Z", body:["M50 33V60"], arms:["M50 40L36 54","M50 40L66 30L72 16"], legs:["M50 60L40 86","M50 60L60 86"]},
    walk:{t:"تمشي", head:"M50 15a9 9 0 1 1-.1 0Z", body:["M50 33V60"], arms:["M50 40L40 54","M50 40L60 52"], legs:["M50 60L40 86","M50 60L63 84"]},
    run:{t:"تركض", head:"M56 15a9 9 0 1 1-.1 0Z", body:["M54 33L48 60"], arms:["M53 40L66 44L72 36","M53 40L40 46L34 54"], legs:["M48 60L62 70L58 86","M48 60L36 68L24 64"]},
    jump:{t:"تقفز", head:"M50 9a9 9 0 1 1-.1 0Z", body:["M50 27V52"], arms:["M50 34L34 22","M50 34L66 22"], legs:["M50 52L38 64L42 76","M50 52L62 64L58 76"]}
  };
  function localFigure(phrase){
    const np = norm(phrase);
    const pose = /ركض|جري|يجر/.test(np) ? "run" : /لوح|تحيه|يسلم|مرحب/.test(np) ? "wave" : /قفز|ينط/.test(np) ? "jump" : /مشي|يمش/.test(np) ? "walk" : /يقف|واقف|وقوف/.test(np) ? "stand" : "";
    const isFig = board.title.indexOf("شخصية") === 0;
    const asked = /عصوي|شخص|ولد|رجل|بنت|طفل|معلم|طالب|انسان|لاعب/.test(np);
    if(!(asked || (isFig && pose))) return false;
    const P = POSES[pose || "stand"];
    const keep = n => { const o = isFig && board.parts.find(x=>x.name===n); return o ? o.fill : ""; };
    board = {title:"شخصية " + P.t, parts:[
      {name:"الأرض", fill:"", draw:["M15 88H85"]},
      {name:"الجسم", fill:"", draw:P.body},

      micBtn.classList.toggle("on", listening);
      micBtn.textContent = listening ? "أوقف الاستماع" : "ابدأ الكلام";
      setState(e.state==="listening" ? "يستمع الآن" : e.state==="starting" ? "يجهّز الميكروفون" : e.state==="finishing" ? "يكمل آخر الكلمات" : "جاهز", e.state==="listening");
      if(e.state==="idle" && WHY[e.reason] && e.reason!=="not_granted" && e.reason!=="dismissed") note(WHY[e.reason]);
    });
  }
  boot();
})();
</script>

</body>
</html>
