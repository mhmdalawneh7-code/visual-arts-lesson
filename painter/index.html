<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>الرسّام الحي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
  /* Layout: one big sheet of paper (the stage) that fills piece by piece as Claude draws, over a compact dock for speaking or typing. Paper stays light in both themes so colours read true. */
  :root{
    --bg:#e9d6ac; --surface:#fff7e6; --ink:#16090e; --muted:#6b5a5f; --accent:#8a1538; --line:#e2d3bd; --paper:#fffdf7; --danger:#b3123a; --gold:#e0a93f;
    --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
    --font-display:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--bg:#16090e;--surface:#241017;--ink:#f4ead7;--muted:#b9a79f;--accent:#e0a93f;--line:#3a2028;--paper:#1f0d14;--danger:#ff7a8a;--gold:#e0a93f;color-scheme:dark}
  }
  :root[data-theme="dark"]{--bg:#16090e;--surface:#241017;--ink:#f4ead7;--muted:#b9a79f;--accent:#e0a93f;--line:#3a2028;--paper:#1f0d14;--danger:#ff7a8a;--gold:#e0a93f;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);direction:rtl;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    display:flex;flex-direction:column;gap:12px;padding-block:12px}
  #top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px}
  #top{background:#7a1430;color:#f6ead2;border-radius:18px;padding:10px 16px;box-shadow:0 6px 18px rgba(80,10,30,.25)}
  #brand{font-family:var(--font-display);font-size:20px;display:flex;align-items:center;gap:10px;color:#f6ead2}
  #brand::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent)}
  #dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  #dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(246,234,210,.35);cursor:pointer}
  #dots button.on{background:#f1dfb5;width:24px;border-radius:6px}
  #stage{flex:1;min-height:0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  #paper{position:relative;border-width:2px;width:min(100cqw,1100px,calc((100cqh - 64px) * 1.6));aspect-ratio:8/5;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 14px 40px rgba(22,9,14,.18),inset 0 0 0 10px var(--paper);cursor:pointer}
  #canvas{display:block;width:100%;height:100%}
  #canvas > *{animation:appear .55s ease backwards}
  @keyframes appear{from{opacity:0}to{opacity:1}}
  #busy{position:absolute;top:12px;inset-inline-start:12px;display:none;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:15px}
  #paper.busy #busy{display:flex}
  #busy i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:beat 1s infinite ease-in-out}
  #busy i:nth-of-type(2){animation-delay:.15s}#busy i:nth-of-type(3){animation-delay:.3s}
  @keyframes beat{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
  #caption{margin:0;min-height:40px;text-align:center;font-family:var(--font-display);font-size:clamp(20px,3.4vw,38px);line-height:1.4;text-wrap:balance;color:var(--ink)}
  #caption:empty{display:none}
  #dock{background:linear-gradient(180deg,#7a1430,#5c0f24);color:#f6ead2;border:0;border-radius:22px;box-shadow:0 6px 20px rgba(22,9,14,.08);padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:env(safe-area-inset-bottom,0px)}
  #examples{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  #examples::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid #a33a57;background:#8f1b3d;color:#f6ead2;font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  #row{display:flex;gap:8px;align-items:center}
  #cmd{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid #a33a57;background:#fff7e6;color:#16090e}
  #cmd::placeholder{color:#7a5a60}
  #cmd:focus-visible,.btn:focus-visible,.chip:focus-visible,#dots button:focus-visible,#paper:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .btn{font:inherit;font-size:16px;font-weight:600;border:0;border-radius:14px;padding:12px 18px;background:#f1dfb5;color:#6e1028;cursor:pointer;flex:none;transition:transform .15s ease,opacity .15s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:#f6ead2;border:1.5px solid #a33a57}
  .btn:disabled{opacity:.45;cursor:default}
  #stop{background:#d9405f;color:#fff;display:none}
  #mic{font-size:22px;padding:9px 14px}
  #status{color:#f1dfb5;font-size:14px;min-height:1.4em;line-height:1.5}
  #status.err{color:var(--danger)}
  #nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
  [hidden]{display:none!important}
  #keycard .btn.ghost{color:var(--ink);border-color:var(--line);background:transparent}
  #mic.on{background:#16a58a;color:#fff;border-color:transparent;animation:ring 1.6s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(22,165,138,.5)}100%{box-shadow:0 0 0 14px rgba(22,165,138,0)}}
  #keybtn{padding:6px 12px;font-size:14px}
  #keybox{position:fixed;inset:0;background:rgba(10,14,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  #keycard{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(480px,100%);display:flex;flex-direction:column;gap:12px}
  #keycard h2{margin:0;font-family:var(--font-display);font-size:22px}
  #keycard p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
  #keycard input,#keycard select{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
  #keycard input{direction:ltr;text-align:left}
  #keyrow{display:flex;gap:8px;justify-content:flex-start}
  @media (prefers-reduced-motion:reduce){#canvas > *,#busy i{animation:none}#mic.on{animation:none}}
</style>

<div id="top">
  <div id="brand">الرسّام الحي</div>
  <button class="btn ghost" id="keybtn" type="button">المفتاح</button>
  <div id="dots" role="tablist" aria-label="الرسومات"></div>
</div>
<main id="stage">
  <div id="paper" tabindex="0" role="img" aria-label="الرسمة">
    <svg id="canvas" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="busy"><i></i><i></i><i></i><span>الرسّام يرسم</span></div>
  </div>
  <p id="caption" aria-live="polite"></p>
</main>
<section id="dock">
  <div id="examples"></div>
  <form id="row" autocomplete="off">
    <button class="btn ghost" id="mic" type="button" aria-label="تكلّم">🎤</button>
    <button class="btn ghost" id="pastecmd" type="button" aria-label="لصق الطلب" style="font-size:20px;padding:9px 14px">📋</button>
    <input id="cmd" type="text" enterkeyhint="send" autocorrect="off" autocapitalize="off" placeholder="اضغط 🎤 وتكلّم، أو اكتب هنا ما تريد رسمه">
    <button class="btn" id="send" type="submit">ارسم</button>
    <button class="btn" id="stop" type="button">إيقاف</button>
  </form>
  <div id="status"></div>
  <div id="nav">
    <button class="btn ghost" id="prev" type="button">السابق</button>
    <button class="btn ghost" id="again" type="button">ارسمها من جديد</button>
    <button class="btn ghost" id="next" type="button">التالي</button>
  </div>
</section>

<div id="keybox" hidden>
  <form id="keycard" autocomplete="off">
    <h2>مفتاح الذكاء الاصطناعي</h2>
    <p>اختر الخدمة التي عندك مفتاحها. الصفحة تتصل بها من متصفحك مباشرة لترسم. الصق المفتاح مرة واحدة. يُحفظ في هذا المتصفح فقط ولا يُرسل لغير الخدمة التي اخترتها. تكلفة الرسم تُحسب على حسابك هناك.</p>
    <input id="key" type="password" placeholder="sk-..." aria-label="مفتاح API">
    <button class="btn ghost" id="paste" type="button">📋 لصق المفتاح من الحافظة</button>
    <select id="provider" aria-label="الخدمة"><option value="anthropic">Claude (Anthropic)</option><option value="openai">ChatGPT (OpenAI)</option></select>
    <input id="model" list="models" aria-label="اسم النموذج" placeholder="اسم النموذج" style="direction:ltr;text-align:left">
    <datalist id="models"></datalist>
    <div id="keyrow"><button class="btn" type="submit">حفظ</button><button class="btn ghost" id="keycancel" type="button">إغلاق</button></div>
  </form>
</div>

  function errCopy(e){
    var c = e && e.code;
    if(c === "bad_key"){ openKey(); return "المفتاح غير صحيح أو غير مفعّل. تأكد منه وتأكد من اختيار الخدمة الصحيحة."; }
    if(c === "rate_limited") return "الطلبات كثيرة أو رصيد الحساب منخفض. انتظر قليلاً.";
    if(c === "empty_completion") return "ما قدرت أرسم هذا الطلب. جرّب صياغة ثانية.";
    if(c === "network") return "تعذّر الاتصال بالإنترنت أو بـ Claude.";
    return "حصل خطأ أثناء الرسم" + (e && e.message ? ": " + e.message : "") + ".";
  }
  async function streamModel(prompt, signal, onText){
    var isO = PROVIDER === "openai", url, headers, body;
    if(isO){
      url = "https://api.openai.com/v1/chat/completions";
      headers = {"content-type":"application/json", "authorization":"Bearer " + KEYS.openai};
      body = {model:MODELS.openai, stream:true, max_completion_tokens:16000, messages:[{role:"user", content:prompt}]};
    } else {
      url = "https://api.anthropic.com/v1/messages";
      headers = {"content-type":"application/json", "x-api-key":KEYS.anthropic, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"};
      body = {model:MODELS.anthropic, max_tokens:8000, stream:true, messages:[{role:"user", content:prompt}]};
    }
    var res;
    try{ res = await fetch(url, {method:"POST", signal:signal, headers:headers, body:JSON.stringify(body)}); }
    catch(e){ if(e && e.name === "AbortError") throw e; throw {code:"network"}; }
    if(!res.ok){
      var msg = ""; try{ msg = (await res.json()).error.message; }catch(e){}
      throw {code: (res.status === 401 || res.status === 403) ? "bad_key" : (res.status === 429 ? "rate_limited" : "http"), message: msg};
    }
    var reader = res.body.getReader(), dec = new TextDecoder(), buf = "", text = "";
    for(;;){
      var r = await reader.read();
      if(r.done) break;
      buf += dec.decode(r.value, {stream:true});
      var parts = buf.split("\n\n"); buf = parts.pop();
      for(var i = 0; i < parts.length; i++){
        var m = parts[i].match(/^data: (.*)$/m);
        if(!m || m[1] === "[DONE]") continue;
        var ev; try{ ev = JSON.parse(m[1]); }catch(e){ continue; }
        if(isO){
          var d = ev.choices && ev.choices[0] && ev.choices[0].delta;
          if(d && d.content){ text += d.content; onText(text); }
          else if(ev.error){ throw {code:"http", message: ev.error.message}; }
        } else if(ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta"){ text += ev.delta.text; onText(text); }
        else if(ev.type === "error"){ throw {code:"http", message: ev.error && ev.error.message}; }
      }
    }
    return text;
  }

  async function draw(cmd, fresh){
    var hit = libMatch(cmd);
    if(hit && !busy){ instantDraw(hit, cmd); return; }
    if(!KEYS[PROVIDER]){ status("هذه الكلمة ليست في المكتبة الفورية. الكلمات المتاحة الآن: بيت، تمر، جمل، خيمه، دلفين، دله، سفين، سمك، سوق، شمس، صقر، طاير، فانوس، فراشه، قطه، لؤلؤ، مسجد، نجم، نخله. أو أضف مفتاح الذكاء الاصطناعي من الزر 🔑 لرسم أي كلمة.", true); return; }
    if(busy){ status("الرسّام مشغول، انتظر قليلاً."); return; }
    var keep = cur;
    var my = ctl = new AbortController();
    setBusy(true); resetStream(); $("caption").textContent = ""; status("🗣 " + cmd);
    try{
      var full = await streamModel(buildPrompt(cmd), my.signal, function(t){ feed(t, false); });
      feed(full, true);
      if(st.count < 4) throw {code:"empty_completion"};
      drawings.push({title: st.title || cmd.slice(0, 40), markup: canvas.innerHTML, cmd: cmd});
      cur = drawings.length - 1; setBusy(false); showCurrent(); status("🗣 " + cmd);
    }catch(e){
      if(e && e.name === "AbortError") e = {code:"cancelled"};
      setBusy(false);
      if(keep >= 0) showCurrent(); else { canvas.innerHTML = ""; }
      if(e && e.code === "cancelled") status("أوقفت الرسم.");
      else status(errCopy(e), true);
    }
  }

  function norm(t){
    return t.toLowerCase().replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه")
      .replace(/[٠-٩]/g, function(d){ return "٠١٢٣٤٥٦٧٨٩".indexOf(d); }).replace(/\s+/g, " ").trim();
  }
  function local(raw){
    var t = norm(raw), m;
    if(t.length > 24) return false;
    if((m = t.match(/^(?:اذهب الي |روح )?(?:رسمه|شريحه) (\d+)$/))){ go(parseInt(m[1], 10) - 1); return true; }
    if(/^(التالي|التاليه|كمل|بعدها|next)$/.test(t)){ go(cur + 1); return true; }
    if(/^(السابق|السابقه|ارجع|رجوع|قبل|back|previous)$/.test(t)){ go(cur - 1); return true; }
    if(/^(الاولي|الاولى|البدايه|اول رسمه)$/.test(t)){ go(0); return true; }
    if(/^(الاخيره|اخر رسمه)$/.test(t)){ go(drawings.length - 1); return true; }
    if(/^(اعد|اعد الرسم|ارسم من جديد|ارسمها من جديد|مره ثانيه)$/.test(t)){ again(); return true; }
    if(/^(وقف|قف|وقفها|جمد|تجميد)$/.test(t)){ togglePause(); return true; }
    if(/^(احذف|امسح)( هذي| هذه)?( الرسمه)?$/.test(t)){
      if(drawings.length > 1 && !busy){ drawings.splice(cur, 1); cur = Math.min(cur, drawings.length - 1); showCurrent(); status("حُذفت الرسمة"); }
      return true;
    }
    return false;
  }
  function again(){ if(cur >= 0 && drawings[cur] && drawings[cur].cmd) draw(drawings[cur].cmd, true); }
  function togglePause(){
    try{ if(paused){ canvas.unpauseAnimations(); } else { canvas.pauseAnimations(); } paused = !paused; status(paused ? "الحركة متوقفة. المس الرسمة لتتحرك." : ""); }catch(e){}
  }
  function run(){
    var el = $("cmd"), v = el.value.trim();
    if(!v) return;
    el.value = "";
    if(local(v)){ if(!/^$/.test(v)) status("🗣 " + v); return; }
    draw(v, false);
  }

  });

  /* ===== المايك ===== */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, want = false;
  function micState(on){ want = on; $("mic").classList.toggle("on", on); $("mic").setAttribute("aria-pressed", on ? "true" : "false"); }
  function startRec(){
    rec = new SR(); rec.lang = "ar-SA"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = function(e){
      for(var i = e.resultIndex; i < e.results.length; i++){
        var r = e.results[i], tx = r[0].transcript.trim();
        if(r.isFinal){ if(tx){ $("cmd").value = tx; run(); } else { $("cmd").value = ""; } }
        else { $("cmd").value = tx; }
      }
    };
    rec.onerror = function(e){
      if(e.error === "no-speech" || e.error === "aborted") return;
      var msg = {"not-allowed":"الميكروفون محظور. اضغط على أيقونة القفل بجانب العنوان واسمح له.", "service-not-allowed":"الميكروفون محظور في هذا المتصفح.", "network":"التعرف على الصوت يحتاج إنترنت.", "audio-capture":"ما لقيت ميكروفون."}[e.error] || ("خطأ في المايك: " + e.error);
      micState(false); status(msg, true);
    };
    rec.onend = function(){ if(want){ try{ rec.start(); }catch(e){} } };
    rec.start();
  }
  $("mic").onclick = function(){
    if(!SR){ status("هذا المتصفح لا يدعم التعرف على الصوت. افتح الملف في Chrome أو Safari على الكمبيوتر.", true); return; }
    if(want){ micState(false); try{ rec.stop(); }catch(e){} status("المايك متوقف."); return; }
    micState(true); status("اسمح للمايك إن سألك المتصفح...");
    function begin(){ if(!want) return; status("أسمعك... قل ما تريد رسمه."); startRec(); }
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ begin(); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){ s.getTracks().forEach(function(tr){ tr.stop(); }); begin(); }).catch(function(err){
      micState(false);
      var n = err && err.name;
      if(n === "NotFoundError" || n === "OverconstrainedError") status("ما لقيت ميكروفون في الجهاز. وصّل ميكروفوناً ثم جرّب.", true);
      else status("الميكروفون ممنوع. (١) اضغط أيقونة القفل بجانب عنوان الصفحة ← الميكروفون ← سماح، ثم حدّث الصفحة. (٢) على ماك: إعدادات النظام ← الخصوصية والأمان ← الميكروفون ← فعّل Chrome أو Safari. (٣) إن فتحت الرابط من داخل تطبيق، افتحه في Chrome أو Safari.", true);
    });
  };

  if(!KEYS[PROVIDER]){ status("ابدأ بإدخال مفتاح الذكاء الاصطناعي من زر «المفتاح»، ثم اضغط 🎤."); }
  else { status("اضغط 🎤 وقل ما تريد رسمه. المس الرسمة لإيقاف الحركة."); }
  if(!SR){ status("المايك يحتاج Chrome أو Safari على الكمبيوتر. الكتابة تعمل في كل المتصفحات."); }
})();
</script>
