<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#531126">
<title>مرسم قطر التفاعلي | دروس الرسم</title>
<style>
:root{--wine:#58152d;--wine2:#340d1f;--wine3:#812c4d;--sand:#d7aa74;--cream:#fff9ef;--ink:#3e2930;--gold:#d9a95a;--muted:#916d72;--mint:#24a47c;--warn:#ed9b43;--radius:22px;--font:Tahoma,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:var(--font);background:radial-gradient(ellipse 110% 80% at 50% -30%,#9c4360 0%,var(--wine) 48%,var(--wine2) 100%);color:#fff;direction:rtl}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f2c969;outline-offset:2px}
#shell{position:relative;height:100dvh;min-height:380px;display:flex;flex-direction:column;padding:clamp(10px,1.7vh,22px) clamp(12px,2.5vw,38px) calc(12px + env(safe-area-inset-bottom));gap:12px;isolation:isolate}
#shell:before,#shell:after{content:"";position:absolute;bottom:0;left:0;width:100%;height:28%;z-index:-1;pointer-events:none}#shell:before{background:#925d58;clip-path:polygon(0 75%,19% 37%,38% 70%,57% 28%,82% 75%,100% 42%,100% 100%,0 100%);opacity:.25}#shell:after{background:linear-gradient(0deg,#c39a6d,#b98268);clip-path:polygon(0 78%,13% 62%,30% 82%,46% 52%,62% 70%,81% 51%,100% 81%,100% 100%,0 100%);opacity:.35}
#artboard{position:relative;flex:1;min-height:0;max-width:1550px;width:100%;margin:auto;border:5px solid rgba(255,236,199,.34);border-radius:var(--radius);background:#fffaf0;box-shadow:0 18px 45px rgba(21,0,10,.30),inset 0 0 0 1px #eee0ce;overflow:hidden;isolation:isolate}
#artboard:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 30% 10%,rgba(255,255,255,.95),transparent 55%),repeating-linear-gradient(0deg,rgba(125,81,66,.027) 0 1px,transparent 1px 37px),repeating-linear-gradient(90deg,rgba(125,81,66,.02) 0 1px,transparent 1px 37px)}
#mainSvg{position:absolute;inset:0;width:100%;height:100%;z-index:1;touch-action:none}#mainSvg .guide{stroke-dasharray:10 9;opacity:.5}#mainSvg .pen-trace{filter:drop-shadow(1px 2px 1px #6b33437a)}
#spoken{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;pointer-events:none;padding:4%;text-align:center;font-size:clamp(24px,5.4vw,79px);font-weight:900;line-height:1.48;color:#6c1735;text-shadow:2px 2px 0 #fffaf2,0 5px 15px #fff;opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s}#spoken.show{opacity:1;transform:none}#spoken span{display:inline-block;padding:.2em .5em;border-radius:16px;background:rgba(255,248,229,.87);box-shadow:0 8px 30px #66423432}
#lessonHud{position:absolute;top:12px;inset-inline:16px;z-index:5;display:none;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}#lessonHud.visible{display:flex}#lessonHud>*{pointer-events:auto}#sceneTitle{background:rgba(88,21,45,.96);color:#fff;padding:10px 16px;border-radius:12px;font-size:clamp(13px,1.7vw,23px);font-weight:bold;box-shadow:0 3px 8px #4c122133}#stepBadge{background:#fff7e6;color:#6d203a;font-weight:800;border-radius:12px;padding:10px 13px;font-size:clamp(12px,1.4vw,19px)}.hudBtn{border:1px solid #dec5a4;background:rgba(255,252,245,.96);color:#6b2943;border-radius:11px;padding:9px 13px;font-weight:800;font-size:clamp(13px,1.5vw,19px)}.hudBtn:hover{background:#f3e5d0}#timerHud{display:none;align-items:center;gap:7px;color:#6f213d;background:#fff4de;border-radius:14px;padding:7px 13px;font-size:clamp(17px,2.2vw,28px);font-weight:900}#timerHud.visible{display:flex}#timerHud button{border:0;background:transparent;font-size:18px;color:#6f213d}#lessonHint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(255,250,237,.94);color:#785b57;font-size:clamp(12px,1.2vw,17px);border-radius:11px;padding:8px 14px;text-align:center;display:none;max-width:90%}#lessonHint.visible{display:block}
#status{position:absolute;inset-inline-end:11px;top:9px;z-index:6;display:flex;gap:8px;align-items:center}#version{border:1px solid #e2bb82;background:#fff5e9;color:#713550;font:700 12px var(--font);border-radius:999px;padding:5px 10px;opacity:.83}#soundState{display:none;background:#fff8e9;color:#743d4d;border-radius:100px;padding:6px 10px;align-items:center;gap:6px;font-size:12px;font-weight:bold}#soundState.visible{display:flex}#soundDot{width:9px;height:9px;border-radius:50%;background:#ae8c78}#soundState.listening #soundDot{background:#2aaa7e;box-shadow:0 0 0 3px #2aaa7e33}#soundState.hearing #soundDot{background:#ed9e35;animation:pulse .6s infinite}#soundState.decoding #soundDot{background:#8c6dda}#soundState.error #soundDot{background:#d64550;box-shadow:0 0 0 3px #d6455022}@keyframes pulse{50%{transform:scale(1.4)}}
#toolbar{width:min(100%,1550px);margin:auto;min-height:70px;display:flex;gap:9px;padding:8px;background:rgba(45,8,25,.65);border:1px solid #d9a95a44;border-radius:18px;box-shadow:0 10px 28px #26071180;align-items:center}#toolbar button{flex-shrink:0;white-space:nowrap;min-height:52px;background:rgba(255,246,234,.13);color:#fff;border:1px solid #f3dcb848;border-radius:12px;padding:11px 16px;font-weight:800;font-size:clamp(13px,1.4vw,19px)}#toolbar button:hover,#toolbar button.active{background:#9c4662}#micBtn{width:56px!important;min-width:56px;padding:9px!important;background:linear-gradient(135deg,#a54c67,#76233f)!important}#micBtn.on{background:#266f60!important}#micBtn svg{width:27px;height:27px;display:block;margin:auto}#command{height:52px;flex:1;min-width:70px;color:#452231;border:0;border-radius:12px;padding:0 18px;font-size:clamp(14px,1.6vw,21px);background:#fffaf0;box-shadow:inset 0 2px 5px #7b595321}#sendBtn{font-size:24px!important;padding:0 14px!important;background:#a97151!important}#toolbar .toolText{display:inline}#toolbar button.tool{display:flex;align-items:center;gap:6px}#toolbar button.tool svg{width:20px;height:20px}
#modalShade{position:fixed;inset:0;background:rgba(30,7,21,.62);z-index:20;display:none;place-items:center;padding:16px;backdrop-filter:blur(5px)}#modalShade.open{display:grid}#modal{width:min(92vw,900px);max-height:min(88dvh,900px);overflow:auto;background:#fffaf1;color:#40212d;border-radius:22px;box-shadow:0 30px 80px #15010c88;padding:clamp(16px,2.5vw,32px)}#modalHeader{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #e8d6c1;padding-bottom:16px;margin-bottom:20px}#modalTitle{margin:0;color:#64233e;font-size:clamp(22px,2.8vw,34px)}#closeModal{border:0;color:#733047;background:#eadfd2;border-radius:11px;min-width:42px;height:42px;font-size:24px}#modalBody{font-size:18px;line-height:1.8}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.tile{min-height:110px;background:white;border:2px solid #ecd7c3;border-radius:14px;color:#4e253a;text-align:center;font-weight:800;font-size:19px;padding:15px 8px;transition:.15s}.tile:hover{transform:translateY(-2px);border-color:#a3516a}.tile small{display:block;font-size:13px;color:#ac7581;font-weight:500}.btn{border:0;background:#6a1e3b;color:white;border-radius:12px;padding:11px 17px;margin:5px;font-weight:800;font-size:16px}.btn.alt{background:#e9d7c5;color:#5c2940}.btn.green{background:#0b8b6a}.field{width:100%;padding:12px 13px;border:2px solid #e1c9bb;border-radius:12px;background:#fff;font-size:18px;color:#3b2230;margin:7px 0 14px}.muted{color:#866b71;font-size:15px}.pill{display:inline-block;background:#f2e2ca;padding:5px 13px;border-radius:30px;margin:3px;font-weight:700;color:#65314b}.quizOption{display:block;width:100%;border:2px solid #ddc7b9;border-radius:14px;padding:14px 18px;text-align:right;background:#fff;color:#42283a;margin:9px 0;font-size:21px;font-weight:750;transition:.2s}.quizOption.good{background:#c7f4df;border-color:#178760;color:#105a3b}.quizOption.bad{background:#ffe0b8;border-color:#d17d2b;color:#86501c}.quizOption:disabled{cursor:default}.quizTitle{font-size:clamp(22px,2.5vw,30px);color:#5f1f3d;font-weight:900}.quizTop{display:flex;justify-content:space-between;flex-wrap:wrap;color:#8e5260;font-weight:800}.criteria{display:grid;gap:10px}.criterion{display:grid;grid-template-columns:1fr auto;gap:14px;background:white;padding:15px;border-radius:12px;border:1px solid #ebd5c1}.bigResult{text-align:center;font-weight:900;font-size:clamp(32px,5vw,66px);color:#137c62}#toast{position:fixed;bottom:104px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;background:#542136;color:#fff;padding:13px 20px;border-radius:13px;box-shadow:0 10px 25px #1d031178;max-width:85vw;text-align:center;font-size:17px;transition:.2s}#toast.on{opacity:1;transform:translate(-50%,0)}
#studentLayer{display:none;position:absolute;inset:0;z-index:3}#studentLayer.open{display:block}#teacherGhost{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none}#studentCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}#studentTools{display:none;position:absolute;z-index:6;bottom:14px;right:50%;transform:translateX(50%);border:1px solid #dec9ae;background:#fff9e9ed;color:#69304b;border-radius:15px;padding:8px;align-items:center;gap:7px;max-width:94%;overflow:auto}#studentTools.open{display:flex}#studentTools button{border:1px solid #e6ceae;border-radius:9px;background:#fff;color:#592c43;padding:8px;font-weight:bold;white-space:nowrap;min-width:42px}#studentTools input[type=color]{width:36px;height:36px;border:0;background:transparent}#studentTools input[type=range]{width:85px;accent-color:#772842}#studentTools label{white-space:nowrap;color:#5f3047;font-size:13px}#studentTools button.active{background:#e4b26b}#conceptLayer{display:none;position:absolute;inset:0;z-index:2;pointer-events:none}#conceptLayer.open{display:block}#conceptSvg{width:100%;height:100%}#conceptCaption{position:absolute;bottom:20px;left:4%;right:4%;text-align:center;color:#60283f;font-size:clamp(16px,2.7vw,32px);font-weight:900;background:#fff9ecea;padding:12px;border-radius:16px}#conceptSvg .interactive{pointer-events:all;cursor:grab}#conceptSvg text{font-family:var(--font)}
@media(max-width:700px){#shell{padding:8px 7px calc(8px + env(safe-area-inset-bottom));gap:7px}#artboard{border-width:3px;border-radius:14px}#toolbar{border-radius:12px;gap:4px;padding:5px;min-height:53px}#toolbar button{min-height:43px;padding:8px 9px;font-size:12px}#micBtn{min-width:40px!important;width:40px!important}#micBtn svg{width:21px;height:21px}#sendBtn{padding:0 8px!important}#command{height:43px;padding:0 9px;font-size:14px}#toolbar .toolText{display:none}#toolbar button.tool svg{width:22px;height:22px}#lessonHud{top:7px;inset-inline:8px;gap:4px}#status{top:auto;bottom:8px;left:10px;right:auto}#lessonHint{bottom:44px}#sceneTitle,#stepBadge,.hudBtn{padding:6px 8px;border-radius:8px}#studentTools{bottom:7px}#toast{bottom:75px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0.001ms!important;transition-duration:0.001ms!important;scroll-behavior:auto!important}}
#micMeter{height:22px;background:#e9dac9;border-radius:30px;overflow:hidden;border:1px solid #cfb5a2;margin:12px 0}#micMeterFill{height:100%;width:0%;transition:width .12s ease-out;background:linear-gradient(90deg,#328971,#95c76c,#e4b65c)}.micNote{border-right:4px solid #a36d68;background:#f8eddf;padding:12px 14px;border-radius:10px;margin:12px 0;line-height:1.8}.micCode{direction:ltr;unicode-bidi:isolate;font:800 14px monospace;color:#943852}
@media(prefers-reduced-motion:reduce){#micMeterFill{transition:none}}
</style>
</head>
<body>
<div id="shell">
<main id="artboard" aria-label="لوحة الرسم التفاعلية">
 <svg id="mainSvg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-label="الرسم المتحرك">
  <defs><pattern id="paperdots" patternUnits="userSpaceOnUse" width="20" height="20"><circle cx="1" cy="1" r=".7" fill="#cfbaaa" opacity=".22"/></pattern></defs>
  <rect x="0" y="0" width="1000" height="600" fill="url(#paperdots)"/><g id="paintLayer"></g><g id="inkLayer"></g><g id="penLayer"></g>
 </svg>
 <div id="spoken" aria-live="polite"><span id="spokenText"></span></div>
 <div id="lessonHud"><span id="sceneTitle"></span><span id="stepBadge"></span><button type="button" class="hudBtn" id="prevStep" title="أعد الخطوة">↶ إعادة</button><button type="button" class="hudBtn" id="nextStep" title="الخطوة التالية">التالي ←</button><button type="button" class="hudBtn" id="fullDrawing">الرسمة كاملة</button><span id="timerHud">⏳ <span id="timerText">00:30</span> <button id="timerCancel" title="إيقاف المؤقت">×</button></span></div>
 <div id="lessonHint" role="status"></div>
 <div id="status"><span id="version">v1.0.1</span><span id="soundState"><span id="soundDot"></span><span id="soundLabel">الميكروفون متوقف</span></span></div>
 <div id="conceptLayer"><svg id="conceptSvg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet"></svg><div id="conceptCaption"></div></div>
 <div id="studentLayer"><svg id="teacherGhost" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet"></svg><canvas id="studentCanvas" width="1000" height="600" aria-label="مساحة رسم الطالب"></canvas></div>
 <div id="studentTools"><label>اللون <input type="color" id="brushColor" value="#60314c"></label><label>السُّمك <input type="range" id="brushWidth" min="1" max="32" value="5"></label><button id="eraserBtn">ممحاة</button><button id="undoBtn">تراجع</button><button id="clearStudentBtn">مسح</button><button id="ghostBtn">إخفاء النموذج</button><button id="mirrorBtn">تماثل</button><button id="exitStudent">إنهاء</button></div>
</main>
<footer id="toolbar" aria-label="أوامر المرسم">
<button type="button" id="micBtn" title="تشغيل الميكروفون" aria-label="تشغيل الميكروفون"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg></button>
<input id="command" type="text" aria-label="اكتب أمراً للرسم" autocomplete="off" placeholder="قل أو اكتب: ارسم المحمل، الخطوة التالية، المكتبة…">
<button id="sendBtn" type="button" title="تنفيذ الأمر" aria-label="تنفيذ الأمر">➤</button>
<button id="questionsBtn" class="tool" title="أسئلة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 9a3 3 0 1 1 5 2.3c-2 1.5-2 2.2-2 3.1M12 17h.01"/></svg><span class="toolText">أسئلة</span></button>
<button id="clearBtn" class="tool" title="امسح الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15l9-10 7 7-8 9H7zM12 21h9"/></svg><span class="toolText">امسح الشاشة</span></button>
<button id="fullBtn" class="tool" title="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg><span class="toolText">ملء الشاشة</span></button>
</footer>
</div>
<div id="modalShade" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section id="modal"><header id="modalHeader"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="إغلاق">×</button></header><div id="modalBody"></div></section></div><div id="toast" role="status"></div>

let speakingTimeout,toastTimeout;st.defaultPause=30;
function elSvg(tag,attrs={},root){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(root)root.appendChild(n);return n}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}
function announce(text,ms=1650){const box=$('#spoken'),t=$('#spokenText');clearTimeout(speakingTimeout);t.textContent=text;box.classList.add('show');speakingTimeout=setTimeout(()=>box.classList.remove('show'),ms)}
function toast(text){clearTimeout(toastTimeout);$('#toast').textContent=text;$('#toast').classList.add('on');toastTimeout=setTimeout(()=>$('#toast').classList.remove('on'),3500)}
function showHint(text,ms=6500){const h=$('#lessonHint');h.textContent=text;h.classList.add('visible');clearTimeout(h._timeout);h._timeout=setTimeout(()=>h.classList.remove('visible'),ms)}
function stopAnimation(){if(st.anim){cancelAnimationFrame(st.anim);st.anim=null}clear(pen)}
function resetVisual(){svg.style.visibility='visible';stopAnimation();$('#conceptLayer').classList.remove('open');st.concept=null;$('#studentLayer').classList.remove('open');$('#studentTools').classList.remove('open');st.mode='normal'}
function stopTimer(){if(st.timer)clearInterval(st.timer);st.timer=null;st.remaining=0;$('#timerHud').classList.remove('visible')}
function timer(seconds){stopTimer();seconds=Math.max(1,Math.min(3600,Math.round(seconds)));st.remaining=seconds;st.timerEnds=Date.now()+seconds*1000;const update=()=>{st.remaining=Math.max(0,Math.ceil((st.timerEnds-Date.now())/1000));$('#timerText').textContent=String(Math.floor(st.remaining/60)).padStart(2,'0')+':'+String(st.remaining%60).padStart(2,'0');if(!st.remaining){stopTimer();announce('انتهى الوقت، أحسنتم!',2500)}};$('#timerHud').classList.add('visible');update();st.timer=setInterval(update,250)}

function renderToLayers(visibleSteps=st.step){clear(paint);clear(ink);clear(pen);const paths=[];
 for(const block of st.blocks){const scene=scenes[block.key];if(!scene)continue;const tr=`translate(${block.dx||0} ${block.dy||0}) scale(${block.scale||1})`;const pg=elSvg('g',{transform:tr},paint),ig=elSvg('g',{transform:tr},ink);
  for(let i=0;i<=visibleSteps;i++) for(const item of scene.steps[i]||[]){if(item.fill){elSvg('path',{d:item.d,fill:block.key==='المحمل'&&item.d.startsWith('M482 134')&&st.sailColor?st.sailColor:item.fill,stroke:'none',opacity:i===3?'.92':'1'},pg)}else{const path=elSvg('path',{d:item.d,fill:'none',stroke:item.c||palette.dark,'stroke-width':item.w||5,'stroke-linecap':'round','stroke-linejoin':'round',class:item.guide?'guide':''},ig);if(item.dash)path.setAttribute('stroke-dasharray','7 9');if(i===visibleSteps)paths.push({path,block,step:i})}}}
 return paths;
}
function drawScene(key,{add=false}={}){if(!scenes[key])return false;stopTimer();resetVisual();if(!add){st.blocks=[{key,dx:0,dy:0,scale:1}];st.step=-1;st.scale=1}else{st.blocks.push({key,dx:key==='شمس'?215:-185,dy:key==='شمس'?-145:110,scale:.45})}
 if(!add)st.sailColor=null;st.scene=key;$('#lessonHud').classList.add('visible');$('#sceneTitle').textContent=scenes[key].title;showHint(scenes[key].desc,6000);if(!add)nextStep();else{st.step=3;renderToLayers(3);$('#stepBadge').textContent='رسمة مركّبة';announce('أضفت '+scenes[key].title)}return true}
function playPaths(paths,done){stopAnimation();if(reduced){done();return}const drawable=paths.filter(x=>x.path.getTotalLength&&x.path.getTotalLength()>0);if(!drawable.length){done();return}const start=performance.now();const lengths=drawable.map(v=>Math.max(1,v.path.getTotalLength()));const durations=lengths.map(n=>Math.max(160,n*1.25)/st.speed);const sum=durations.reduce((a,b)=>a+b,0);
 drawable.forEach((v,i)=>{v.path.style.strokeDasharray=String(lengths[i]);v.path.setAttribute('stroke-dashoffset',String(lengths[i]))});
 const tip=elSvg('g',{class:'pen-trace'},pen);elSvg('circle',{r:10,fill:'#b47d54',stroke:'#4e2539','stroke-width':3},tip);elSvg('path',{d:'M-5 0L9 -22L18 -26L21 -15L6 5Z',fill:'#e0b16c',stroke:'#794254','stroke-width':2},tip);elSvg('path',{d:'M9 -22L18 -26L21 -15Z',fill:'#524548'},tip);
 const tick=now=>{const elapsed=Math.max(0,now-start);let remaining=elapsed;let idx=0;for(;idx<durations.length;idx++){if(remaining<=durations[idx])break;remaining-=durations[idx]};drawable.forEach((v,j)=>v.path.setAttribute('stroke-dashoffset',j<idx?'0':j>idx?lengths[j]:String(lengths[j]*(1-Math.min(1,remaining/durations[j])))));
 if(idx<drawable.length){const q=drawable[idx],point=q.path.getPointAtLength(lengths[idx]*Math.min(1,remaining/durations[idx]));const b=q.block;tip.setAttribute('transform',`translate(${(point.x*(b.scale||1))+(b.dx||0)} ${(point.y*(b.scale||1))+(b.dy||0)})`)}

function stopAudioTest(notify=false){
 if(micTestFrame)cancelAnimationFrame(micTestFrame);micTestFrame=0;
 if(micTestStream){micTestStream.getTracks().forEach(t=>t.stop());micTestStream=null}
 if(micTestContext){micTestContext.close().catch(()=>{});micTestContext=null}

async function testAudioInput(){
 stopAudioTest();let label=$('#micTestStatus');if(!label)return;
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){
  label.textContent='لا يمكن فحص الجهاز هنا (INSECURE/NO_MEDIA_DEVICES). افتح الصفحة عبر HTTPS أو localhost.';return;
 }
 label.textContent='جارٍ طلب إذن الميكروفون…';
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false},video:false});
  micTestStream=stream;
  // قد تكون نافذة التشخيص قد أغلقت أثناء طلب الإذن.
  if(!$('#modalShade').classList.contains('open')||!$('#micMeterFill')){stopAudioTest();return}
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx){label.textContent='سُمح باستخدام الميكروفون، لكن عرض مستوى الصوت غير مدعوم (NO_AUDIO_CONTEXT).';return}

  const input=context.createMediaStreamSource(stream),analyser=context.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.5;input.connect(analyser);
  const data=new Uint8Array(analyser.fftSize);let maxObserved=0,frame=0;
  label.textContent='المسار الصوتي مفتوح. تحدث الآن لرؤية استجابة المؤشر.';
  const update=()=>{
   if(!micTestStream||!$('#micMeterFill')||!$('#modalShade').classList.contains('open'))return;
   analyser.getByteTimeDomainData(data);let sum=0;for(const x of data){const z=(x-128)/128;sum+=z*z}
   const rms=Math.sqrt(sum/data.length),level=Math.min(100,Math.round(rms*460));maxObserved=Math.max(level,maxObserved*.95);

function queueSpeechText(text){
 text=String(text||'').trim();if(!text)return;

 },1000);
}
