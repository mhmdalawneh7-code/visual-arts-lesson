<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>العرض الحي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* مسرح عنابي داكن، والرسمة على ورقة فاتحة في الوسط، والكلام يتحرك في الأسفل */
  --stage:#3a0718; --stage2:#5c0f26; --paper:#fff8ea; --gold:#f0c45a; --ink:#2a1414; --sand:#ecd9b4;
  --display:"Reem Kufi","Tajawal",Tahoma,sans-serif; --body:"Tajawal",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(110% 80% at 50% 10%,var(--stage2),var(--stage));color:#fff;font-family:var(--body);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#fx{position:fixed;inset:0;pointer-events:none;opacity:.5}
#fx svg{position:absolute;fill:none;stroke:var(--gold);stroke-width:2;opacity:.35;animation:float 16s ease-in-out infinite alternate}
@keyframes float{from{transform:translate(0,0) rotate(0)}to{transform:translate(30px,-40px) rotate(45deg)}}
.app{position:relative;height:100%;display:flex;flex-direction:column;padding:10px 16px 12px;gap:6px}
#trail{display:flex;gap:10px;justify-content:center;align-items:center;min-height:clamp(54px,12vh,110px)}
.th{width:clamp(54px,11vh,104px);aspect-ratio:1;border-radius:50%;background:var(--paper);display:grid;place-items:center;padding:10px;animation:pop .5s ease,bob 4s ease-in-out infinite alternate;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.th:nth-child(even){animation-delay:0s,-2s}
.th svg{max-width:100%;max-height:100%}
.th.c{padding:0;border:5px solid var(--paper)}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-12deg)}to{opacity:1;transform:none}}
#hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.2vh,14px);text-align:center}
.paper{background:var(--paper);border-radius:32px;padding:clamp(10px,2.4vh,26px);display:grid;place-items:center;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.paper.big{height:min(46vh,70vw);aspect-ratio:1.25}
.paper svg{max-width:100%;max-height:100%;width:100%;height:100%}
.row{display:flex;gap:clamp(8px,2vw,26px);justify-content:center;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .55s cubic-bezier(.2,1.4,.4,1) backwards}
.cell .paper{height:min(26vh,26vw);aspect-ratio:1;border-radius:24px;animation:none}
.cell b{font-family:var(--display);font-size:clamp(16px,2.6vw,34px);color:var(--sand)}
.canvas{height:min(66vh,54vw);aspect-ratio:16/9;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:rise .5s ease;background:var(--paper)}
.canvas svg{width:100%;height:100%;display:block}
.pnew{animation:rise .7s ease}
.blob{height:min(26vh,26vw);aspect-ratio:1;border-radius:46% 54% 52% 48%/50% 46% 54% 50%;animation:wob 5s ease-in-out infinite alternate;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.blob.big{height:min(40vh,56vw)}
@keyframes wob{to{border-radius:54% 46% 47% 53%/46% 54% 46% 54%;transform:rotate(8deg)}}
.cal{font-family:var(--display);font-size:clamp(22px,4.4vw,60px);color:#8a1538;font-weight:700}
h1{margin:0;font-family:var(--display);font-weight:700;color:var(--gold);font-size:clamp(28px,6vw,84px);line-height:1.15;animation:rise .5s ease;text-wrap:balance}
#fact{min-height:1.6em;font-size:clamp(16px,2.6vw,36px);font-weight:700;color:#fff;max-width:28em;line-height:1.5;text-wrap:balance}
#fact span{display:inline-block;animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.qcard{background:var(--paper);color:var(--ink);border-radius:28px;padding:clamp(14px,3vh,34px) clamp(16px,3vw,44px);max-width:min(92vw,1000px);box-shadow:0 18px 50px rgba(0,0,0,.45);animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.qcard small{font-family:var(--display);color:#8a1538;font-size:clamp(14px,1.8vw,24px)}
.qcard p{margin:6px 0 0;font-size:clamp(20px,3.4vw,46px);font-weight:900;line-height:1.5}
.qcard .ans{margin-top:12px;padding-top:12px;border-top:3px dashed #8a1538;color:#1f6f78;display:none}
.qcard.open .ans{display:block;animation:rise .5s ease}
.draw path.s{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .9s ease forwards;animation-delay:var(--d)}
.draw path.f{opacity:0;animation:fi .7s ease forwards;animation-delay:var(--fd)}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fi{to{opacity:var(--o)}}
#say{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:max-content;max-width:92vw;display:flex;flex-wrap:wrap;gap:.2em .34em;justify-content:center;font-family:var(--display);font-size:clamp(28px,6vw,84px);font-weight:700;line-height:1.3;padding:.3em .7em;border-radius:.5em;background:rgba(40,5,18,.78);box-shadow:0 14px 50px rgba(0,0,0,.5);transition:opacity .5s;pointer-events:none}
#say:empty,#say.hide{opacity:0}
#say span{display:inline-block;animation:rise .35s ease}
#say span.k{animation:rise .35s ease,pulse .6s ease .1s;font-size:1.18em;text-shadow:0 0 24px rgba(240,196,90,.7)}
@keyframes pulse{50%{transform:scale(1.2)}}
#cards{position:fixed;inset:clamp(8px,2vh,24px) 12px auto;z-index:3;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-height:86vh;overflow:auto;padding:14px}
.card{position:relative;width:min(380px,92vw);border:0;border-radius:22px;padding:14px 18px;text-align:start;box-shadow:0 12px 34px rgba(0,0,0,.45);animation:pop .5s cubic-bezier(.2,1.4,.4,1);transition:transform .4s,opacity .4s,box-shadow .4s}
.card small{font-family:var(--display);opacity:.8;font-size:clamp(13px,1.5vw,18px)}
.card p{margin:4px 0 0;font-size:clamp(18px,2.3vw,30px);font-weight:900;line-height:1.5}
.card .ans{display:none;margin-top:10px;padding-top:10px;border-top:3px dashed currentColor}
.card.open .ans,.card.ok .ans{display:block;animation:rise .5s ease}
.card .tick{display:none;position:absolute;top:-14px;inset-inline-end:-10px;width:46px;height:46px;border-radius:50%;background:#2f9e55;color:#fff;font-size:30px;line-height:46px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.card.ok{box-shadow:0 0 0 6px #2f9e55,0 12px 34px rgba(0,0,0,.45)}
.card.ok .tick{display:block;animation:pop .5s ease}
.card.spot{transform:scale(1.1);z-index:2;box-shadow:0 0 0 6px var(--gold),0 0 70px 18px rgba(240,196,90,.75)}
#cards.hasspot .card:not(.spot){opacity:.3}
body.hascards #hero,body.hascards #trail{opacity:.18;transition:opacity .4s}
#hero.hasspot .cell:not(.spot){opacity:.25;transition:opacity .4s}
#hero .cell.spot .paper,#hero .cell.spot .blob,#hero>.paper.spot,#hero>.blob.spot{box-shadow:0 0 0 6px var(--gold),0 0 80px 22px rgba(240,196,90,.8)}
#hero .cell.spot{transform:scale(1.12);transition:transform .4s}
.ctl{position:fixed;bottom:10px;inset-inline-end:12px;display:flex;gap:8px;align-items:center;z-index:5}
#dot{width:46px;height:46px;border-radius:50%;border:2px solid var(--sand);background:rgba(0,0,0,.25);display:grid;place-items:center}
#dot svg{width:22px;height:22px;fill:var(--sand)}
#dot.live{background:var(--gold);border-color:var(--gold);animation:ring 1.6s infinite}
#dot.live svg{fill:var(--stage)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(240,196,90,.6)}100%{box-shadow:0 0 0 16px rgba(240,196,90,0)}}
#kb{width:46px;height:46px;border-radius:50%;border:2px solid rgba(236,217,180,.5);background:rgba(0,0,0,.25);font-size:20px;color:var(--sand)}
#form{position:fixed;bottom:10px;inset-inline:12px 124px;display:none;z-index:5}
#form.show{display:block}
#typed{width:100%;height:46px;border-radius:999px;border:2px solid var(--sand);background:rgba(0,0,0,.45);padding:0 18px;font-size:17px}
#msg{position:fixed;top:10px;inset-inline:12px;text-align:center;font-size:clamp(14px,1.8vw,20px);color:var(--stage);background:var(--gold);border-radius:14px;padding:8px 14px;display:none;z-index:6;font-weight:700;line-height:1.6}
#msg.show{display:block}
#start{position:fixed;inset:0;z-index:9;background:radial-gradient(110% 80% at 50% 10%,var(--stage2),var(--stage));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#start.hide{display:none}
#start h2{margin:0;font-family:var(--display);color:var(--gold);font-size:clamp(34px,8vw,88px)}
#start p{margin:0;font-size:clamp(16px,2.4vw,26px);color:var(--sand);max-width:26em;line-height:1.7}
#go{border:0;border-radius:999px;background:var(--gold);color:var(--stage);font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,40px);padding:14px 46px}
#measure{position:absolute;width:0;height:0;overflow:hidden;visibility:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw path.s{stroke-dashoffset:0}.draw path.f{opacity:var(--o)}}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<div class="app">
  <div id="trail" aria-hidden="true"></div>
  <div id="hero" aria-live="polite"></div>
</div>
<div id="cards" aria-live="polite"></div>
<div id="say" class="hide" aria-live="off"></div>
<div id="msg" role="status"></div>
<form id="form"><input id="typed" type="text" autocomplete="off" placeholder="اكتب ما تريد قوله ثم Enter" aria-label="اكتب بدل الصوت"></form>
<div class="ctl">
  <button id="kb" type="button" aria-label="الكتابة بدل الصوت">⌨</button>
  <button id="dot" type="button" aria-label="تشغيل الميكروفون أو إيقافه"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5a1 1 0 0 0-2 0 4 4 0 0 1-8 0 1 1 0 0 0-2 0 6 6 0 0 0 5 5.9V20H8.5a1 1 0 0 0 0 2h7a1 1 0 0 0 0-2H13v-2.6a6 6 0 0 0 5-5.9z"/></svg></button>
</div>
<div id="start">
  <h2>العرض الحي</h2>
  <p>تكلّم واشرح درسك. كل ما تذكره يظهر على الشاشة ويتحرك مع رسمة ومثال.</p>
  <button id="go" type="button">ابدأ الاستماع</button>
</div>

يساعد على انتظام الشبكة الزخرفية؟","التباعد المتساوي"]],"العمارة الإسلامية":[["ما وظيفة المئذنة التقليدية في المسجد؟","موضع رفع الأذان"],["ما الشكل الهندسي الذي نستخدمه لتبسيط القبة؟","نصف دائرة"],["أين يمكن مشاهدة الأقواس؟","عند المداخل والنوافذ"],["ما المشربية؟","عنصر معماري شبكي"],["ما الذي يميز الزخرفة المعمارية؟","التكرار والتناظر"]],"الخط العربي":[["أين تقع نقطة الباء المفردة؟","أسفل الحرف"],["ما فائدة نقاط القياس في الخط؟","ضبط النسب"],["أي خط شائع في نسخ الكتب؟","النسخ"],["هل يقتصر الخط العربي على زخرفة الحروف؟","لا، يعتمد أيضاً على قواعد النسب"],["بماذا نبدأ عند التدرّب على حرف؟","ملاحظة اتجاه الحركة"]],"الفنانون القطريون":[["ماذا يمكن أن يوثّق الفنان القطري في عمله؟","التراث والبيئة والحياة"],["أي أسلوب يساعد على التعبير عن الهوية؟","توظيف عناصر البيئة المحلية"],["ما السؤال المناسب عند مشاهدة عمل فني؟","ما عناصر الفن في العمل؟"],["من عناصر التكوين البصري؟","الخط والشكل واللون"],["ما السلوك الصحيح تجاه أعمال الفنانين؟","احترام الحقوق وذكر المصدر"]],"الألعاب الشعبية القطرية":[["ما فائدة توثيق الألعاب الشعبية في الرسم؟","المحافظة على الذاكرة الثقافية"],["ما الذي يظهر حركة الأطفال في الرسم؟","اتجاه الأجسام والخطوط"],["ما الذي نتعلّمه من الألعاب الجماعية؟","التعاون واحترام القواعد"],["أي خلفية تناسب مشهداً تراثياً؟","الفريج القديم"],["كيف نعبر عن البعد بين الشخصيات؟","بتغيير الحجم والتداخل"]],"التراث القطري":[["بماذا ارتبط المحمل الخشبي التقليدي؟","الصيد والتجارة والغوص"],["ما النشاط الذي اشتهرت به الزبارة قديماً؟","التجارة والغوص على اللؤلؤ"],["ما اللون الأساسي في علم قطر؟","العنابي والأبيض"],["ما اسم أداة تقديم القهوة العربية؟","الدلّة"],["ما شكل متكرر في السدو؟","المعين والمثلث"]],"عناصر الفن":[["ما الذي يحدّد الشكل في الرسم؟","الخط الخارجي"],["ما الألوان الأساسية في مزج الأصباغ المدرسي؟","الأحمر والأصفر والأزرق"],["ما الملمس؟","إحساس السطح أو مظهره"],["ما فائدة الظل؟","إظهار الحجم والاتجاه"],["ماذا نصنع بخط الأفق ونقطة التلاشي؟","منظوراً بعمق"]],"سؤال وصورة":[["ما اسم الزينة المضيئة التي تُعلَّق في رمضان؟","فانوس"],["ما اسم المبنى الذي له قبة ومئذنة ويُصلّى فيه؟","مسجد"],["ما اسم الحشرة الملوّنة ذات الجناحين الجميلين؟","فراشة"],["ما اسم الطائر الجارح الذي يحلّق فوق الصحراء؟","صقر"],["ما المكان الذي تتجاور فيه الدكاكين وتظهر فيه الأقواس القديمة؟","سوق"],["ما اسم البيت المبني من الطين وله نافذة؟","بيت"],["ما الكائن البحري الذكي الذي يقفز فوق الماء؟","دلفين"],["ما الإناء الذي يُصبّ منه القهوة العربية؟","دلة"],["ما المسكن الذي يُنصب في الصحراء ويُصنع من الشعر؟","خيمة"],["ما الحيوان الذي يُعرف بـ«سفينة الصحراء»؟","جمل"],["ما الكنز الذي كان أهل قطر يغوصون لاستخراجه من البحر؟","لؤلؤ"]],"اختبار الفنون البصرية":[["ما الألوان الأساسية الثلاثة؟","الأحمر والأزرق والأصفر — الألوان الأساسية لا تُصنع من ألوان أخرى، ومنها تُصنع بقية الألوان."],["اللون البرتقالي لون ثانوي، ومن أي لونين يُصنع؟","الأحمر والأصفر — البرتقالي = أحمر + أصفر."],["أي الألوان الآتية يُصنع من الأزرق والأصفر؟","الأخضر — الأزرق + الأصفر = الأخضر."],["أي الألوان الآتية من الألوان الدافئة؟","الأصفر — الألوان الدافئة: الأحمر والأصفر والبرتقالي، وتعطي إحساساً بالحرارة."],["ما الفرق بين اللون الفاتح (التِّنت) واللون الداكن (الشيد)؟","التنت يُضاف إليه الأبيض، والشيد يُضاف إليه الأسود — إضافة الأبيض تُفتّح اللون، وإضافة الأسود تُغمقه."],["الخط المنكسر المتعرج يعطي إحساساً بـ:","الحركة والنشاط — الخطوط المتعرجة والمنكسرة توحي بالحركة والنشاط."],["أي هذه الأشكال يُعتبر شكلاً هندسياً؟","المربع — الأشكال الهندسية: المربع والدائرة والمثلث والمستطيل."],["ما الزخرفة الهندسية التي تتكرر فيها أشكال النجوم والأضلاع بنظام؟","الزخرفة الهندسية الإسلامية — الزخرفة الهندسية الإسلامية تقوم على التكرار المنتظم للأشكال."],["الأرابيسك في الفن الإسلامي يعتمد على:","الأغصان والأوراق والزهور المتشابكة — الأرابيسك زخرفة نباتية متشابكة ومتكررة."],["لماذا تجنّب الفنانون المسلمون رسم الكائنات الحية في بعض الزخارف؟","تركيزاً على الجمال المجرد والزخرفة الهندسية والنباتية — اتجه الفن الإسلامي إلى الزخارف الهندسية والنباتية، مع تنوع كبير في الفنون الأخرى."],["أي نوع من الخط العربي يمتاز بالزوايا الحادة والقوة؟","الكوفي — خط الكوفي خط زاوي قوي، ومن أقدم أنواع الخط العربي."],["أي نوع من الخط العربي يُستخدم كثيراً في تزيين المساجد والمصاحف؟","الثلث — خط الثلث جميل ومتقن، ويُستخدم في الزخرفة والعناوين."],["ما الخط الذي نكتب به الكتب والمصاحف عادةً لوضوحه؟","النسخ — خط النسخ واضح ومقروء، ولذلك يُستخدم في الكتب."],["السدو فن قطري تقليدي، وهو:","نسيج يدوي من الوبر والصوف والشعر — السدو نسيج يدوي يصنعه البدو من وبر الإبل وصوف الأغنام وشعر الماعز."],["السدو يتميز بالزخارف الهندسية مثل:","المعينات والخطوط والمربعات — من أشهر زخارف السدو المعينات والخطوط المتكررة والألوان الزاهية."],["ماذا يُسمى الفن الذي يُصنع من الطين ويُحرق في الفرن؟","الخزف — الخزف فن من الطين يُشكَّل ثم يُحرق ليصبح صلباً."],["أين يقع متحف الفن الإسلامي؟","الدوحة — متحف الفن الإسلامي يقع في الدوحة على كورنيش الدوحة."],["أي سوق تراثي شهير في الدوحة يُعدّ من معالم المدينة القديمة؟","سوق واقف — سوق واقف من أشهر المعالم التراثية في الدوحة، ويضم حرف الحياة القديمة."],["ما نوع الخط الذي يكون مائلاً وممتداً ومتصلاً؟","الديواني — الديواني خط منحنٍ ومتداخل، وكان يُستخدم في المراسلات الرسمية."],["ما الفرق بين التوازن المتماثل والتوازن غير المتماثل؟","المتماثل: الجانبان متشابهان، وغير المتماثل: الجانبان مختلفان لكن متوازنان — التوازن المتماثل يُشبه الميزان المتساوي، وغير المتماثل يحقق الاتزان بعناصر مختلفة."],["التكرار في الفن يعني:","تكرار العنصر بنظام لخلق إيقاع — التكرار المنتظم يخلق إيقاعاً بصرياً، وهو أساس الزخرفة الإسلامية."],["ما اللون الناتج من خلط الأحمر والأزرق؟","البنفسجي — الأحمر + الأزرق = البنفسجي."],["ما اسم الفنّ الذي يُنجز بالتقطيع والتركيب بقصاصات الورق الملوّنة؟","الكولاج — الكولاج: تركيب قصاصات من مواد مختلفة على سطح واحد."],["أي هذه المواد تُستخدم في الرسم بالألوان المائية؟","الماء والألوان الشفافة على الورق — الألوان المائية شفافة وتُمزج بالماء على ورق خاص."],["ما الفنّ الذي يعتمد على إضافة مساحات بارزة أو غائرة في مادة صلبة كالخشب والحجر؟","النحت — النحت فن ثلاثي الأبعاد يُشكّل فيه الفنان المادة."],["ما الدور الذي كان يقوم به صيادو اللؤلؤ في تاريخ قطر؟","الغوص لاستخراج اللؤلؤ — الغوص على اللؤلؤ من أهم أنشطة قطر الاقتصادية قديماً، وهو من تراثها."],["أي هذه السفن الخشبية التقليدية ترتبط بتر في التصميم حول محور، فيبدو متزناً ومتناسقاً."],["أين نجد الزخارف الإسلامية في قطر؟","في المساجد وأبواب البيوت القديمة وسوق واقف ومتحف الفن الإسلامي."],["ما هو التشعّب في الزخرفة؟","تفرّع الخطوط والأغصان من أصل واحد لتملأ المساحة بانسجام."],["ما معنى الأرابيسك؟","الاسم الأوروبي للزخرفة النباتية الإسلامية المتشابكة."],["ما الفرق بين الزخرفة الهندسية والنباتية؟","الهندسية تعتمد الخطوط والأشكال كالمربع والنجمة، والنباتية تعتمد الأوراق والسيقان المتشابكة."],["ما المواد التي نُفّذت عليها الزخارف الإسلامية؟","الجص والخشب والخزف والزجاج والمعادن والسجاد والمخطوطات."],["ما هو التجريد في الفن الإسلامي؟","تحويل الأشكال الواقعية إلى أشكال مبسّطة ورموز بعيدة عن المحاكاة."]]},{"name":"العمارة الإسلامية","keys":["العماره","عماره","معماري","المباني"],"qs":[["ما أبرز عناصر العمارة الإسلامية؟","القبة، والمئذنة، والأقواس، والمحراب، والصحن، والمشربية."],["ما وظيفة القبة؟","تغطية المساحات الواسعة، وتعزيز انتشار الصوت والضوء، ولها رمز جمالي للسماء."],["ما وظيفة المئذنة؟","يُرفع منها الأذان، وهي علامة مميزة للمسجد في المدينة."],["ما هو المحراب؟","تجويف في جدار القبلة يحدد اتجاه الكعبة ويقف أمامه الإمام."],["ما هي المشربية؟","نافذة خشبية مخرّمة تُدخل الهواء والضوء وتحفظ خصوصية البيت."],["ما هو البَرجيل ولماذا استُخدم في قطر؟","ملقف هواء يُبرّد البيت طبيعياً بالتقاط الهواء من الأعلى، بسبب حرارة الجو."],["من أشهر المباني التراثية في قطر؟","قلعة الزبارة، وقلعة الكوت (الدوحة)، وبرج برزان، وسوق واقف."],["ما المواد التي بُنيت بها البيوت القطرية قديماً؟","الحجر البحري والجص (الصاروج) وجذوع النخيل والخشب (الدنچل)."],["ما هو الصحن في المسجد؟","الساحة المكشوفة وسط المسجد تحيط بها الأروقة."],["ما هي المقرنصات؟","حليات معمارية تشبه خلايا النحل تزيّن أسفل القباب والأقواس وتنقل الشكل من المربع إلى الدائرة."],["ما هو الليوان؟","ممر مسقوف مفتوح على الفناء يحمي من الشمس والمطر."],["لماذا كانت نوافذ البيوت القطرية صغيرة وعالية؟","لتقليل دخول حرارة الشمس وحفظ خصوصية البيت."],["ما أشهر معالم الدوحة التي تجمع القديم والحديث؟","سوق واقف ومتحف الفن الإسلامي وحي كتارا الثقافي."]]},{"name":"الخط العربي","keys":["الخط","خط عربي","الخط العربي","خطوط","الكتابه"],"qs":[["ما هو الخط العربي؟","فن كتابة الحروف العربية بقواعد وجمال، وهو من أرقى الفنون الإسلامية."],["اذكر أشهر أنواع الخط العربي.","الكوفي، والنسخ، والثلث، والرقعة، والديواني، والفارسي، والإجازة."],["ما الخط الأقدم؟","الخط الكوفي، ويمتاز بالزوايا والاستقامة، وكُتبت به المصاحف الأولى."],["ما الخط المستخدم في طباعة الكتب والمصاحف؟","خط النسخ، لوضوحه وسهولة قراءته."],["ما الخط الذي نكتب به عادةً بسرعة؟","خط الرقعة، وهو أسهل الخطوط وأسرعها في الكتابة اليومية."],["ما أدوات الخطاط؟","القلم (القصبة أو البوص)، والحبر، والمِقطّة، والورق المصقول."],["من أشهر الخطاطين في التاريخ الإسلامي؟","ابن مقلة، وابن البوّاب، وياقوت المستعصمي."],["كيف يصبح الخط زخرفة؟","بتكرار الكلمات وتشابكها وتكوينها في أشكال هندسية، كما في الزخرفة الكتابية."],["ما الخط المستخدم في العناوين والمساجد؟","خط الثلث، لجلاله وجمال تداخل حروفه."],["ما الخط الذي يكثر في الوثائق الرسمية العثمانية؟","الخط الديواني، بانحناءاته المتصلة."],["ما الفرق بين الكوفي والنسخ؟","الكوفي مستقيم بزوايا حادة، والنسخ ليّن بانحناءات واضحة وسهل القراءة."],["ما المقصود بقياس القلم في الخط؟","وحدة قياس بالنقطة المعيّنة تحدد نسب الحرف وطوله."],["كيف نحافظ على فن الخط العربي؟","بتعلّمه وممارسته وزيارة معارضه وتوظيفه في التصميم الحديث."]]},{"name":"الفنانون القطريون","keys":["الفنانين","فنان","فنانين","الفنانون","التشكيليين"],"qs":[["من هو جاسم زيني؟","من روّاد الفن التشكيلي في قطر، اهتم برسم البيئة المحلية والبحر والغوص والحياة الشعبية."],["من هو يوسف أحمد؟","فنان قطري معروف بأعماله المستوحاة من الخط العربي وورق البردي والحروفية."],["من هو علي حسن؟","فنان قطري بارز في الفن الحروفي، يوظّف الحرف العربي كعنصر تشكيلي."],["ما هي الحروفية في الفن؟","اتجاه فني يستخدم الحرف العربي كعنصر جمالي في اللوحة لا كنص للقراءة فقط."],["أين يمكن مشاهدة أعمال الفنانين القطريين؟","متحف: المتحف العربي للفن الحديث، ومتحف الفن الإسلامي، والصالات الفنية في كتارا."],["ما الموضوعات التي رسمها الفنانون القطريون؟","البحر والغوص والصحراء والخيمة والعمارة الشعبية والتراث والخط العربي."],["ما دور الفنان في حفظ التراث؟","يوثّق عناصر التراث في أعماله فيحفظها للأجيال ويعرّف العالم بهويته."],["ما هو المتحف العربي للفن الحديث؟","متحف في الدوحة يضم أعمالاً عربية حديثة ومعاصرة، ومنها أعمال فنانين قطريين."],["ما دور كتارا في دعم الفن؟","حي ثقافي فيه صالات عرض ومسارح وورش تدعم الفنانين وتقيم المعارض."],["ما الخامات التي يستخدمها الفنانون القطريون؟","الألوان الزيتية والأكريليك والورق المصنوع يدوياً والطباعة والتصوير والتركيب."],["لماذا يرسم كثير من الفنانين القطريين البحر؟","لأن البحر كان مصدر الرزق والغوص والسفر، فهو جزء من ذاكرة المكان."],["كيف نصبح فنانين؟","بالممارسة اليومية والرسم من الملاحظة ودراسة أعمال الآخرين والمشاركة في المعارض."]]},{"name":"الألعاب الشعبية القطرية","keys":["الالعاب","العاب شعبيه","لعبه","الالعاب الشعبيه"],"qs":[["ما هي الألعاب الشعبية؟","ألعاب توارثها الأبناء عن الآباء، تُلعب بأدوات بسيطة من البيئة وفي الأحياء والفرجان."],["اذكر أشهر الألعاب الشعبية القطرية.","الدحروي، وطاق طاق طاقية، وعظيم سرحان، والخشيشة، وأم الدرايس، والصقلة."],["ما فائدة الألعاب الشعبية؟","تقوّي الجسم وتنمّي التعاون والذكاء وتربط الأجيال بتراثهم."],["كيف نستفيد من الألعاب الشعبية في الفن؟","نرسم مشاهدها ونصمّم منها وحدات زخرفية وملصقات تُعرّف بها."],["بماذا تختلف ألعاب الأمس عن ألعاب اليوم؟","ألعاب الأمس حركية جماعية بأدوات بسيطة، وألعاب اليوم غالباً إلكترونية فردية."],["كيف تُلعب «طاق طاق طاقية»؟","يجلس اللاعبون في دائرة، ويدور أحدهم خلفهم ويضع منديلاً خلف أحدهم ليطارده."],["ما هي «الخشيشة»؟","لعبة شعبية تعتمد على تحريك أداة صغيرة تُصدر صوتاً، وتُلعب في الفرجان."],["متى كانت تُلعب الألعاب الشعبية؟","بعد العصر وفي المساء وفي الأعياد والمناسبات، في ساحات الفرجان."],["ما العلاقة بين اللعبة الشعبية والفن؟","كلاهما تعبير عن ثقافة المجتمع، ويمكن تحويل مشاهد اللعب إلى لوحات وتصاميم."],["ما هي «القرنقعوه»؟","مناسبة شعبية في منتصف رمضان يتجوّل فيها الأطفال بملابس تراثية ويجمعون الحلوى والمكسّرات."]]},{"name":"التراث القطري","keys":["التراث","تراث","تراثنا","التراث القطري"],"qs":[["ما المقصود بالتراث؟","كل ما ورثناه عن الآباء والأجداد من عادات وحرف وفنون ومبانٍ وقيم."],["ما أنواع التراث؟","تراث مادي (مبانٍ وأدوات) وتراث غير مادي (عادات وحرف وأهازيج وألعاب)."],["ما هو السَّدو؟","حرفة نسيج بدوية من صوف الغنم ووبر الإبل بألوان الأحمر والأسود والأبيض والبني، وأشكالها هندسية."],["ما أبرز رموز الكرم في التراث القطري؟","الدلة والفنجان والمجلس والخيمة والتمر."],["بماذا اشتهر القطريون قديماً؟","الغوص على اللؤلؤ وصيد الأسماك والتجارة البحرية ورعي الإبل."],["ما أهمية قلعة الزبارة؟","موقع أثري مُدرج في قائمة التراث العالمي لليونسكو، ويحكي تاريخ قطر التجاري."],["كيف نحافظ على تراثنا؟","بزيارة المتاحف وتعلّم الحرف وتوثيقها بالرسم والتصوير وتعريف الآخرين بها."],["ما دور الفن في خدمة التراث؟","يوثّق عناصره ويعيد توظيفها في تصاميم حديثة تُبرز الهوية القطرية."],["ما هي الحرف التراثية في قطر؟","السدو، وصناعة السفن (القلافة)، وصناعة شباك الصيد، والفخار، والحدادة، وصناعة الحلي."],["ما أهمية سوق واقف؟","سوق الدوحة التراثي الذي يحفظ شكل السوق القديم وفيه الحرف والمأكولات والمجالس."],["ما هي القلافة؟","حرفة صناعة السفن الخشبية وإصلاحها، وكان القلاف من أهم أصحاب المهن."],["ما دور المتاحف في حفظ التراث؟","تجمع القطع وتحفظها وتعرضها وتشرحها للزوار والأجيال الجديدة."],["ما معنى التراث غير المادي؟","ما لا يُلمس من التراث: العادات والأهازيج والحكايات والحرف والمهارات المتوارثة."]]},{"name":"السَّدو","keys":["السدو","سدو","النسيج","نسيج","حياكه","الحياكه"],"qs":[["ما هو السَّدو؟","حرفة نسيج بدوية تُنسج بها بيوت الشَّعر والمفارش والسجاد من صوف الغنم ووبر الإبل وشعر الماعز."],["ما ألوان السدو الأساسية؟","الأحمر والأسود والأبيض والبني، وأحياناً الأخضر، وكانت تُستخرج قديماً من نباتات وأصباغ طبيعية."],["ما أدوات السدو؟","النول الأرضي، والمِغزل لغزل الصوف، والمِنشزة لشدّ الخيوط، والمِدرى لتصفيف الخيط."],["ما أشكال نقوش السدو؟","أشكال هندسية: مثلثات ومعيّنات وخطوط متوازية وأشرطة متكررة، مستوحاة من البيئة الصحراوية."],["من كان ينسج السدو؟","النساء، وكنّ يجتمعن لنسجه في جلسات جماعية تُسمى أحياناً «التعاون»."],["ما استخدامات السدو قديماً؟","بيت الشَّعر، وفواصل الخيمة (القاطع)، والمفارش، والسروج، وأكياس حفظ المتاع."],["لماذا السدو مهم اليوم؟","لأنه جزء من هوية قطر، وقد أُدرج في قائمة اليونسكو للتراث الثقافي غير المادي."],["كيف نستفيد من السدو في الفن؟","نستخرج منه وحدات زخرفية ونوظّفها في التصميم والرسم والملابس والمنتجات الحديثة."],["ما الفرق بين السدو والسجاد المصنّع؟","السدو يُنسج يدوياً بخيوط طبيعية وأشكال هندسية بسيطة، والمصنّع يُنتج بالآلة بكميات كبيرة."],["ما معنى «الشَّجرة» في نقوش السدو؟","وحدة زخرفية متكررة تُشبه تفرّع الشجرة، وتُعدّ من أشهر نقوش السدو."]]}]}</script>
<script>
"use strict";
const D=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).normalize('NFC').replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'')
  .replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^؀-ۿ0-9 ]/g,' ').replace(/\s+/g,' ').trim();
/* توحيد الكلمة: حذف «ال» وأخواتها حتى تتطابق «الغيمة» و«غيمة» و«بالغيمة» */
const strip=w=>{for(let i=0;i<2;i++){const m=/^(ال|بال|لل|كال)(.{2,})$/.exec(w);if(!m)break;w=m[2];}return w;};
const stripW=w=>{const m=/^[وف](.{3,})$/.exec(w);return strip(m?m[1]:w);};
const canon=s=>norm(s).split(' ').map(strip).join(' ');

/* ================= المكتبة: كل كلمة لها ما يظهر ================= */
const ST=D.stickers, PICS=Object.fromEntries(D.pics.map(p=>[p.id,p]));
const ENT=new Map();

const BB={};
function bbox(key){
  if(BB[key])return BB[key];
  const m=$('measure');m.innerHTML=marks(key,false);let b;try{b=m.getBBox();}catch(_){b=null;}m.innerHTML='';
  return BB[key]=b&&b.width?{x:b.x-12,y:b.y-12,w:b.width+24,h:b.height+24}:{x:150,y:60,w:700,h:480};
}
function marks(key,anim){
  const s=ST[key],n=s.s.length,step=Math.min(40,1500/Math.max(n,1)),fd=Math.min(1.7,n*step/1000+.5);
  return s.f.map(f=>`<path class="f" d="${f[0]}" fill="${f[1]}" style="--o:${f[2]};--fd:${fd}s"${anim?'':` opacity="${f[2]}"`}/>`).join('')
    +s.s.map((x,i)=>`<path class="s" d="${x[0]}" fill="none" stroke="${x[1]}" stroke-width="${x[2]}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="--d:${(i*step/1000).toFixed(2)}s"/>`).join('');
}
function stSvg(key,anim){const b=bbox(key);return `<svg class="${anim?'draw':''}" viewBox="${b.x} ${b.y} ${b.w} ${b.h}">${marks(key,anim)}</svg>`;}

 'الفنر':[['ما الفنر؟','مصباح تراثي'],['ما فائدة زجاجة الفنر؟','تحمي اللهب من الهواء']],
 'برج الهواء':[['ما وظيفة البارجيل؟','تبريد البيت بالهواء'],['لماذا يُفتح البارجيل من جهاته الأربع؟','ليستقبل الريح من أي اتجاه']],
 'مبخرة':[['فيمَ تُستخدم المبخرة؟','لحرق العود والبخور'],['ممّ تُصنع المبخرة؟','من الخشب']],
 'علم قطر':[['ما لونا علم قطر؟','عنابي وأبيض'],['كم رأساً في الخط المتعرج؟','تسعة'],['بماذا يُعرف علم قطر؟','الأدعم']],
 'غوص اللؤلؤ':[['ماذا يسمى الغواص؟','الغيص'],['من يسحب الغواص بالحبل؟','السيب'],['من يغنّي للبحّارة؟','النهّام']],
 'شمس':[['ما لون الشمس في الرسم؟','أصفر'],['هل الأصفر لون حار أم بارد؟','حار']],
 'غيمة':[['ما نوع الخطوط التي نرسم بها الغيمة؟','خطوط منحنية'],['ما لون الغيوم الماطرة؟','رمادي']],
 'هلال':[['متى نرى القمر والنجوم؟','في الليل'],['ما شكل الهلال؟','قوس']],
 'نجمة ثمانية':[['كيف نرسم النجمة الثمانية؟','بمربعين متقاطعين'],['كم رأساً للنجمة الثمانية؟','ثمانية']],
 'زخرفة نباتية':[['ممّ تتكون الزخرفة النباتية؟','سيقان وأوراق وأزهار'],['ما الاسم الآخر للزخرفة النباتية؟','التوريق']],
 'x:towers':[['كم طول كورنيش الدوحة تقريباً؟','سبعة كيلومترات'],['ما شكل فندق الشيراتون؟','هرمي'],['ما شكل برج الدوحة؟','أسطواني']]};
const IQB={};
const itemBank=(key,title)=>ITEMQ[key]?(IQB[key]||(IQB[key]={name:title,qs:ITEMQ[key],i:0})):null;
function targetBank(toks){
  let e=null;scan(toks,0,true,r=>{if(!e&&(r.e.k==='st'||r.e.k==='x'||r.e.k==='grp'))e=r.e;});
  if(!e&&painting&&pEls.length){const byId=[...pEls].sort((a,b)=>a.id-b.id),el=pEls.find(x=>x.id===pSpot)||byId.find(x=>x.x||(ITEMQ[x.key]&&!ST[x.key].sky))||byId.find(x=>ITEMQ[x.key])||byId[0];e=el.x?TOWERS:SE[el.key];}
  if(!e&&cur&&(cur.k==='st'||cur.k==='x'||cur.k==='grp'))e=cur;
  if(!e)return null;
  if(e.k==='x')return itemBank('x:towers',e.title);
  if(e.k==='grp')return e.id==='g:mosques'?itemBank('مسجد','المساجد'):(QB.find(b=>norm(b.name)===norm(e.title))||(e.items[0].st?itemBank(e.items[0].st,e.title):null));
  return itemBank(e.key,e.title);
}
const cards=[];
const CARDCOL=[['#fff8ea','#2a1414'],['#f4c430','#2a1414'],['#2468c9','#fff'],['#2f9e55','#fff'],['#d63a2f','#fff'],['#7b45b5','#fff'],['#ef7d22','#2a1414'],['#22b3a6','#fff']];
const COLNAME={احمر:4,حمرا:4,اصفر:1,صفرا:1,ازرق:2,زرقا:2,اخضر:3,خضرا:3,بنفسجي:5,برتقالي:6,فيروزي:7,ابيض:0,بيضا:0};
const ORD=['الاولي','الثانيه','الثالثه','الرابعه','الخامسه','السادسه'];
const STOP=new Set(['من','في','علي','الي','عن','هو','هي','هذا','هذه','التي','الذي','ان','او','ثم','مع','كل','ما','لا','و']);
function speak(text){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text),vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang)),sc=v=>(/natural|online|neural/i.test(v.name)?4:0)+(/google/i.test(v.name)?2:0),v=vs.sort((x,y)=>sc(y)-sc(x))[0];
    if(v){u.voice=v;u.lang=v.lang;}else u.lang='ar-SA';u.rate=.95;muteUntil=Date.now()+text.length*120+1500;u.onend=u.onerror=()=>{muteUntil=Date.now()+400;};speechSynthesis.speak(u);}catch(_){}
}
function renderCards(){
  const box=$('cards');box.classList.toggle('hasspot',cards.some(c=>c.spot));document.body.classList.toggle('hascards',cards.length>0);
  box.innerHTML=cards.map((c,i)=>`<button type="button" class="card ${c.state}${c.spot?' spot':''}" data-i="${i}" style="background:${CARDCOL[c.ci][0]};color:${CARDCOL[c.ci][1]}"><small>بطاقة ${i+1} · ${esc(c.topic)}</small><p>${esc(c.q)}</p><p class="ans">${esc(c.a)}</p><span class="tick">✓</span></button>`).join('');
}
function bankFor(t){const ws=canon(t).split(' ');return QB.find(x=>x.re.some(w=>ws.includes(w)))||(cur&&cur.title&&QB.find(x=>x.re.some(w=>canon(cur.title).split(' ').includes(w))))||null;}
function addCards(n,t,toks){
  const fixed=targetBank(toks||[])||bankFor(t);
  for(let k=0;k<n&&cards.length<6;k++){const b=fixed||QB[qr++%QB.length];let q,tries=0;do{q=b.qs[b.i++%b.qs.length];tries++;}while(cards.some(c=>c.q===q[0])&&tries<b.qs.length);
    if(cards.some(c=>c.q===q[0]))continue;cards.push({q:q[0],a:q[1],topic:b.name,ci:cards.length%CARDCOL.length,state:'ask',spot:false});}
  renderCards();
}
function cardIdx(t){let i=-1;ORD.forEach((o,k)=>{if(t.includes(o))i=k;});return i<0?cards.length-1:Math.min(i,cards.length-1);}
function reveal(i){const c=cards[i];if(!c)return;if(c.state==='ask')c.state='open';renderCards();speak(c.a);}
function cardCmd(t,toks){
  const has=(...k)=>k.some(x=>t.includes(x));
  if(P_ERASE.test(t)){if(toks.includes('كل')||has('البطاقات','الاسيله','جميع'))cards.length=0;else if(cards.length)cards.splice(cardIdx(t),1);return renderCards();}
  if(has('لون')&&cards.length){const c=cards[cardIdx(t)],w=toks.map(strip).find(x=>x in COLNAME);c.ci=w?COLNAME[w]:(c.ci+1)%CARDCOL.length;return renderCards();}
  if(has('جواب','اجاب')){if(!cards.length)return;const ex=ORD.some(o=>t.includes(o));let i=ex?cardIdx(t):cards.findIndex(c=>c.state==='ask');if(i<0)i=cards.length-1;return reveal(i);}
  addCards(numIn(toks)||(has('اسيله','بطاقات')?3:1),t,toks);
}
/* الإجابة بالصوت: إذا قيل الجواب الصحيح تُضاء البطاقة */
function checkAnswer(toks){
  const said=toks.map(strip);let hitCard=false;
  cards.forEach(c=>{if(c.state!=='ask')return;const ans=canon(c.a).split(' ').filter(w=>w.length>1&&!STOP.has(w));if(!ans.length)return;
    const hits=ans.filter(w=>said.some(x=>x===w||(w.length>=4&&lev1(x,w)))).length;
    if(hits>=1&&hits/ans.length>=.6){c.state='ok';hitCard=true;}});
  if(hitCard){renderCards();speak('أحسنت، إجابة صحيحة');}
  return hitCard;
}
/* تسليط الضوء على بطاقة أو على عنصر من الرسمة */
const SPOT=/(^| )(سلط\S*|(?:ال)?ضو|(?:ال)?اضاه|اضي\S*|ركز\S*|ابرز\S*)( |$)/,SPOTOFF=/(^| )(اطف\S*|الغ\S*|ازل\S*|شيل\S*|بدون|اوقف\S*)( |$)/,CARDW=/بطاق|سوال|اسيل|جواب|اجاب/;
let pSpot=0;
function spotOff(){cards.forEach(c=>c.spot=false);renderCards();document.querySelectorAll('#hero .spot').forEach(x=>x.classList.remove('spot'));$('hero').classList.remove('hasspot');if(pSpot){pSpot=0;if(painting)renderPainting(0);}}
function spotlight(t,toks){
  if(CARDW.test(t)){if(!cards.length)return;const i=cardIdx(t);cards.forEach((c,k)=>c.spot=k===i);return renderCards();}
  const es=[];scan(toks,0,true,r=>{if(!es.includes(r.e))es.push(r.e);});
  if(painting){let id=0;es.forEach(e=>{const el=e.k==='x'?pEls.find(x=>x.x):e.k==='st'?[...pEls].reverse().find(x=>x.key===e.key):null;if(el)id=el.id;});if(id){pSpot=id;renderPainting(0);}return;}
  const cells=[...document.querySelectorAll('#hero .cell')];
  if(cur&&cur.k==='grp'&&cells.length){let i=-1;es.forEach(e=>{const k=cur.items.findIndex(it=>e.k==='st'&&it.st===e.key);if(k>=0)i=k;});
    if(i<0)i=cur.items.findIndex(it=>it.label&&toks.map(strip).includes(strip(norm(it.label))));
    if(i>=0){cells.forEach((c,k)=>c.classList.toggle('spot',k===i));$('hero').classList.add('hasspot');}return;}
  const p=document.querySelector('#hero .paper,#hero .blob');if(p)p.classList.add('spot');
}
function common(t,toks){
  if(SPOT.test(t)){if(SPOTOFF.test(t))spotOff();else spotlight(t,toks);return true;}
  if(CARDW.test(t)){cardCmd(t,toks);return true;}
  if(cards.some(c=>c.state==='ask')&&checkAnswer(toks))return true;
  return false;
}

/* ================= فهم الكلام ================= */
function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue;}if(++d>1)return false;if(a.length>b.length)i++;else if(a.length<b.length)j++;else{i++;j++;}}return d+(a.length-i)+(b.length-j)<=1;}
function lookupAt(toks,i){
  if(SKIPW.test(toks[i]))return null;
  const a=strip(toks[i]),b=stripW(toks[i]),firsts=a===b?[a]:[a,b];
  for(let n=Math.min(3,toks.length-i);n>=1;n--){
    const rest=toks.slice(i+1,i+n).map(strip);
    for(const f of firsts){
      const ws=[f].concat(rest),k=ws.join(' ');
      if(BLOCK.has(k))continue;
      if(ENT.has(k))return {e:ENT.get(k),n};
      const pk=ws.map(PH).join(' ');if(ENTP.has(pk))return {e:ENTP.get(pk),n};
    }
  }
  for(let n=Math.min(2,toks.length-i);n>=1;n--){
    const seg=[a].concat(toks.slice(i+1,i+n).map(strip)).map(PH);
    if(seg.some(w=>COMMON.has(w)||w.length<4))continue;
    const m=FUZ[n].find(x=>{let exact=0;for(let j=0;j<n;j++){if(x.w[j]===seg[j])exact++;else if(!(x.w[j].length>=4&&lev1(x.w[j],seg[j])))return false;}return n===1||exact>=1;});
    if(m)return {e:m.e,n};
  }
  return null;
}
/* يمشي على الكلمات من اليمين ويأخذ أطول اسم: «بيت الشعر» قبل «بيت» */
function scan(toks,from,final,fn){
  let i=from;
  while(i<toks.length){
    if(!final&&i>=toks.length-1&&(PREF.has(PH(strip(toks[i])))||PREF.has(PH(stripW(toks[i])))))break;
    const r=lookupAt(toks,i);if(r){fn(r,i);i+=r.n;}else i++;
  }
  return i;
}
let done=0,fired=new Set(),hot=new Set(),sayT=0,quietUntil=0,waitT=0,uHits=0;
const SIZE=/(^| )[وف]?(كبر\S*|اكبر|تكبير|صغر\S*|اصغر|تصغير)( |$)/,SKYW=/(^| )(ال)?(ليل|سماء|سما|غروب|نهار|ظلام)( |$)|مظلم/;
function sayHide(ms){clearTimeout(sayT);sayT=setTimeout(()=>$('say').classList.add('hide'),ms);}
function hear(raw,final,alts){
  const toks=norm(raw).split(' ').filter(Boolean);if(!toks.length)return;
  const isFinal=final===true;
  if(toks.length<done)done=0;
  clearTimeout(waitT);
  const t=toks.join(' '),cmd=CARDW.test(t)||SPOT.test(t)||P_ADD.test(t)||P_ERASE.test(t)||SIZE.test(t)||SKYW.test(t);let drew=false;
  const from=Math.max(0,done-1);
  const next=scan(toks,from,!!final,(r,i)=>{const id=r.e.id+'@'+i;if(fired.has(id))return;fired.add(id);uHits++;for(let k=i;k<i+r.n;k++)hot.add(k);if(!painting&&!cmd&&!cards.length){show(r.e);drew=true;}});
  const shown=done;done=next;
  if(!final&&next<toks.length)waitT=setTimeout(()=>hear(raw,'flush'),900);
  // الكلام في وسط الصفحة بخط كبير وملوّن، ويختفي عند ظهور الرسمة
  const words=String(raw).trim().split(/\s+/),start=Math.max(0,words.length-8),PAL=['#ffffff','#7fd6c8','#ff9db0','#9fd0ff','#c9f08a'];
  const say=$('say');
  say.innerHTML=words.slice(start).map((w,j)=>{const i=start+j,k=hot.has(i);return `<span class="${k?'k':''}" style="color:${k?'#f0c45a':PAL[i%PAL.length]};${i<shown?'animation:none':''}">${esc(w)}</span>`;}).join('');
  if(drew){quietUntil=Date.now()+2600;sayHide(700);}
  else if(Date.now()>quietUntil){say.classList.remove('hide');sayHide(isFinal?1700:6000);}
  if(isFinal){
    const base=cur&&(cur.k==='st'||cur.k==='x'||cur.k==='grp')?cur:null,n0=pEls.length,was=painting;
    if(!common(t,toks)){
      if(painting)paintFinal(t,toks);
      else if(/(^| )[وف]?(ادمج\S*|ندمج\S*|اجمع\S*|نجمع\S*|دمج|ركب\S*)( |$)|لوحه واحده|في لوحه|لوحه جديده/.test(t))startPainting();
      else if(/(^| )(امسح|مسح|نظف)( |$)/.test(t)&&toks.length<=3)clearAll();
      else if(P_ADD.test(t)||SIZE.test(t)||SKYW.test(t)){
        // نبني على الرسمة الظاهرة: «أضف غيوم»، «سماء مظلمة»، «قمر»، «كبّر الجمل»
        if(base||SKYW.test(t)||SIZE.test(t)){if(base||SKYW.test(t)){startPaintingWith(base);paintFinal(t,toks);}}
        else scan(toks,0,true,r=>{show(r.e);drew=true;});
      }
      else if(!uHits&&alts&&alts.length){for(const a of alts){const tk=norm(a).split(' ').filter(Boolean);let got=false;scan(tk,0,true,r=>{if(!got){show(r.e);got=true;}});if(got){sayHide(700);break;}}}
    }
    if(pEls.length>n0||(!was&&painting)){quietUntil=Date.now()+2000;sayHide(500);}
    done=0;fired.clear();hot.clear();uHits=0;
  }
}

/* ================= الاستماع ================= */
let want=false,dict=null,rec=null,running=false,lastEvt=0;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const MOBILE=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
function msg(t){const m=$('msg');m.textContent=t||'';m.classList.toggle('show',!!t);}
function dotUI(){$('dot').classList.toggle('live',want&&(running||!!dict));}
function showTyping(){$('form').classList.add('show');$('typed').focus();}
function startRec(){
  if(!rec){
    rec=new SR();rec.lang='ar-SA';rec.interimResults=true;rec.continuous=!MOBILE;rec.maxAlternatives=3;
    rec.onstart=()=>{running=true;lastEvt=Date.now();msg('');dotUI();};
    rec.onresult=e=>{lastEvt=Date.now();if(Date.now()<muteUntil)return;let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){const al=[];for(let k=1;k<r.length;k++)al.push(r[k].transcript);hear(r[0].transcript,true,al);}else interim+=r[0].transcript+' ';}
      if(interim.trim())hear(interim,false);};
    rec.onerror=e=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){want=false;msg('الميكروفون غير مسموح. اسمح به من إعدادات الموقع في المتصفح ثم اضغط زر الميكروفون.');showTyping();}
      else if(e.error==='network')msg('الاستماع يحتاج اتصالاً بالإنترنت.');
      else if(e.error==='audio-capture'){want=false;msg('لم أجد ميكروفوناً في هذا الجهاز.');showTyping();}
      else if(e.error==='language-not-supported'){rec.lang='ar';}
    };
    rec.onend=()=>{running=false;dotUI();if(want)setTimeout(()=>{if(want&&!running)try{rec.start();}catch(_){}} ,MOBILE?120:250);};
  }
  try{rec.start();}catch(_){}
}
/* حارس: إذا توقف الاستماع بصمت نعيد تشغيله */
setInterval(()=>{if(want&&rec&&!running&&Date.now()-lastEvt>3000){try{rec.start();}catch(_){}}},3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&want&&rec&&!running){try{rec.start();}catch(_){}}});
function listen(on){
  want=on;
  if(dict){if(on)dict.start().catch(()=>{want=false;msg('لم يُسمح بالميكروفون.');showTyping();dotUI();});else dict.stop().catch(()=>{});dotUI();return;}
  if(!SR){want=false;msg('هذا المتصفح لا يدعم الاستماع. افتح الرابط في Chrome على أندرويد أو الكمبيوتر، أو في Safari على آيفون. يمكنك الكتابة الآن.');showTyping();dotUI();return;}
  if(on)startRec();else{try{rec&&rec.stop();}catch(_){}}
  dotUI();
}
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('dictation').then(d=>{if(!d)return;dict=d;
    d.onPartial(({text})=>{if(Date.now()>muteUntil)hear(text,false);});d.onFinal(({text})=>{if(Date.now()>muteUntil)hear(text,true);});
    d.onState(({state,reason})=>{if(state==='idle'&&want&&reason!=='viewer_stopped'&&reason!=='stopped')d.start().catch(()=>{want=false;dotUI();});if(state==='idle'&&(reason==='viewer_stopped'||reason==='stopped')){want=false;}dotUI();});
  }).catch(()=>{});
}
$('go').addEventListener('click',()=>{$('start').classList.add('hide');listen(true);});
$('dot').addEventListener('click',()=>listen(!want));
$('cards').addEventListener('click',e=>{const b=e.target.closest('.card');if(b)reveal(+b.dataset.i);});
if('speechSynthesis' in window)speechSynthesis.getVoices();
$('kb').addEventListener('click',()=>{$('form').classList.toggle('show');if($('form').classList.contains('show'))$('typed').focus();});
$('form').addEventListener('submit',e=>{e.preventDefault();const v=$('typed').value.trim();if(v){done=0;hear(v,true);$('typed').value='';}});
// خلفية متحركة هادئة
{const star=r=>{let p='';for(let k=0;k<16;k++){const a=k*22.5*Math.PI/180,R=k%2?r*.765:r;p+=(k?'L':'M')+(50+R*Math.cos(a)).toFixed(1)+' '+(50+R*Math.sin(a)).toFixed(1);}return p+'Z';};
 $('fx').innerHTML=[[4,8,90,0],[78,6,130,-5],[88,58,100,-9],[6,62,140,-3],[44,30,70,-7]].map(([x,y,s,d])=>`<svg viewBox="0 0 100 100" style="left:${x}%;top:${y}%;width:${s}px;animation-delay:${d}s"><path d="${star(46)}"/></svg>`).join('');}
window.__t={hear,ENT,cards,get cur(){return cur;},get n(){return pEls.length;},get spot(){return pSpot;}};

</script>
