<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سؤال وصورة</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#7a1430;color:#fff7e6;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  #top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 18px;font-size:clamp(14px,2vw,18px);background:#5c0f24}
  #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 18px;gap:12px;min-height:0;overflow:auto}
  #pic{width:min(92vw,calc((100vh - 260px)*1.6));aspect-ratio:800/500;background:#fff7e6;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0006}
  #pic:empty{display:none}
  #pic svg{width:100%;height:100%;display:block}
  #q{font-size:clamp(24px,4.6vw,46px);font-weight:700;text-align:center;line-height:1.5;margin:0}
  #opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  #opts span{background:#f1dfb5;color:#6e1028;border-radius:14px;padding:8px 18px;font-size:clamp(18px,3vw,28px);font-weight:700}
  #ans{font-size:clamp(22px,3.8vw,38px);font-weight:800;color:#16090e;background:#e0a93f;border-radius:14px;padding:6px 22px;visibility:hidden;text-align:center}
  #ans.show{visibility:visible}
  #bar{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 16px 16px;background:#5c0f24}
  #mic{width:84px;height:84px;border-radius:50%;border:0;background:#e0a93f;color:#16090e;font-size:38px;cursor:pointer;box-shadow:0 6px 18px #0008}
  #mic.on{background:#2a9d9a;color:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 #2a9d9a88}50%{box-shadow:0 0 0 16px #2a9d9a00}}
  #status{font-size:clamp(14px,2vw,18px);text-align:center;min-height:1.4em;opacity:.95}
  #status.err{color:#ffd0d0}
  #keybox{display:none;gap:8px;width:min(92vw,520px);align-items:center}
  #keybox.show{display:flex}
  #keyin{flex:1;padding:10px;border-radius:10px;border:0;font-size:16px;direction:ltr}
  #chat{display:none;width:min(92vw,760px);max-height:30vh;overflow:auto;background:#fff7e6;color:#16090e;border-radius:14px;padding:10px 14px;font-size:clamp(16px,2.4vw,22px);line-height:1.7;text-align:right}
  #chat.show{display:block}
  #chat .me{color:#6e1028;font-weight:700}
  #chat .ai{margin-bottom:8px;white-space:pre-wrap}
  #keysave{padding:10px 16px;border-radius:10px;border:0;background:#f1dfb5;color:#6e1028;font-weight:700;font-size:16px}
</style>
</head>
<body>
<div id="top"><span id="num"></span><span>سؤال وصورة - الفنون البصرية</span></div>
<div id="stage">
  <div id="pic"></div>
  <p id="q"></p>
  <div id="opts"></div>
  <div id="ans"></div>
  <div id="chat"></div>
</div>
<div id="bar">
  <button id="mic" aria-label="المايك">🎤</button>
  <div id="keybox"><input id="keyin" placeholder="sk-ant-..." autocomplete="off"><button id="keysave">حفظ</button></div>
  <div id="status">اضغط المايك وقل: التالي، السابق، الجواب، ارسم فانوس، اسأل عن الفخار، أو اسألني أي سؤال</div>
</div>

function prev(){ idx = (idx - 1 + DECK.length) % DECK.length; show(); }
function reveal(){ if(DECK.length && DECK[idx].a){ $("ans").className = "show"; } }
function say(t, err){ $("status").textContent = t; $("status").className = err ? "err" : ""; }

/* ---------- drawings: library first, then the model ---------- */
function libFind(t){
  var P = " " + t.replace(/\s+/g," ") + " ";
  for(var i=0;i<LIB.length;i++){ for(var j=0;j<LIB[i].k.length;j++){ var k = norm(LIB[i].k[j]);
    if(P.indexOf(" " + k + " ") !== -1 || P.indexOf(" ال" + k + " ") !== -1) return LIB[i]; } }
  return null;
}
var OK_TAGS = {g:1,defs:1,lineargradient:1,radialgradient:1,stop:1,path:1,circle:1,ellipse:1,rect:1,line:1,polyline:1,polygon:1,text:1,tspan:1,clippath:1,mask:1,use:1,animate:1,animatetransform:1,animatemotion:1,mpath:1,set:1};
function sanitize(svgText){
  var doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
  if(doc.getElementsByTagName("parsererror").length) return null;
  var root = doc.documentElement;
  if(!root || root.localName !== "svg") return null;
  (function clean(el){
    Array.prototype.slice.call(el.children).forEach(function(c){
      if(!OK_TAGS[c.localName.toLowerCase()]){ el.removeChild(c); return; }
      Array.prototype.slice.call(c.attributes).forEach(function(a){
        var n = a.name.toLowerCase(), v = a.value;
        if(n.indexOf("on") === 0 || /javascript:|data:|expression\(|@import/i.test(v) || ((n==="href"||n==="xlink:href") && v.charAt(0) !== "#") || (/url\(/i.test(v) && !/url\(\s*#/i.test(v))) c.removeAttribute(a.name);
      });
      clean(c);
    });
  })(root);
  root.setAttribute("viewBox", "0 0 800 500");
  return new XMLSerializer().serializeToString(root);
}
function key(){ return lsGet("lp_key"); }
function needKey(){
  $("keybox").className = "show"; $("keyin").value = key(); $("keyin").focus();
  say("أدخل مفتاح Claude مرة واحدة ثم اضغط حفظ.", true);
}
$("keysave").onclick = function(){
  var v = $("keyin").value.trim(); if(!v) return;
  lsSet("lp_key", v); $("keybox").className = ""; say("تم حفظ المفتاح. قل الأمر مرة أخرى.");
};
function ask(prompt, max, system){
  var msgs = typeof prompt === "string" ? [{role:"user", content:prompt}] : prompt;
  var body = {model:"claude-sonnet-5-5", max_tokens:max, messages:msgs};
  if(system) body.system = system;
  return fetch("https://api.anthropic.com/v1/messages", {method:"POST", headers:{
      "content-type":"application/json","x-api-key":key(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body: JSON.stringify(body)
  }).then(function(r){ if(!r.ok) throw new Error(r.status === 401 ? "bad_key" : "http_" + r.status); return r.json(); })
    .then(function(j){ return (j.content||[]).map(function(c){ return c.text || ""; }).join(""); });
}
function drawTopic(topic){
  var hit = libFind(norm(topic));
  if(hit){ insertSlide({q:"الرسمة: " + hit.k[0], o:[], a:"", e:"", svg:hit.svg}); say("رسمة: " + hit.k[0]); return; }
  if(!key()){ needKey(); return; }
  if(busy) return;
  busy = true; say("أرسم: " + topic + " ...");
  var p = "ارسم رسمة كرتونية ملوّنة وبسيطة للأطفال في الصف الخامس والسادس عن: " + topic + ".\n" +
    "أعد كود SVG فقط يبدأ بـ <svg viewBox=\"0 0 800 500\" xmlns=\"http://www.w3.org/2000/svg\"> وينتهي بـ </svg>، بدون أي شرح.\n" +
    "استخدم عناصر path وcircle وellipse وrect وg، واجعل بعض الأجزاء تتحرك بعناصر animate أو animateTransform أو animateMotion (تكرار indefinite).\n" +
    "لا تستخدم صوراً أو روابط خارجية ولا نصوصاً طويلة.";
  ask(p, 4000).then(function(t){
    var a = t.indexOf("<svg"), b = t.lastIndexOf("</svg>");
    var clean = a >= 0 && b > a ? sanitize(t.slice(a, b + 6)) : null;
    if(!clean) throw new Error("bad_svg");
    insertSlide({q:"الرسمة: " + topic, o:[], a:"", e:"", svg:clean});
    say("تم رسم: " + topic);
  }).catch(function(e){
    if(e.message === "bad_key"){ needKey(); return; }
    say("تعذّر الرسم. تأكد من الاتصال والمفتاح. (" + e.message + ")", true);
  }).then(function(){ busy = false; });
}
function insertSlide(s){
  DECK.splice(idx + 1, 0, s); idx = idx + 1; show();
}

/* ---------- questions about any topic ---------- */
function topicQuiz(topic){
  if(!key()){ needKey(); return; }
  if(busy) return;
  busy = true; say("أكتب أسئلة عن: " + topic + " ...");
  var p = "اكتب 5 أسئلة اختيار من متعدد باللغة العربية للطلاب في الصف الخامس والسادس عن الفنون البصرية وموضوع: " + topic + ".\n" +
    "لكل سؤال 4 خيارات، والجواب الصحيح في الحقل a كرقم الخيار (0 إلى 3). أعد JSON فقط بهذا الشكل بدون أي نص آخر:\n" +
    "[{\"q\":\"نص السؤال\",\"o\":[\"خيار\",\"خيار\",\"خيار\",\"خيار\"],\"a\":0,\"e\":\"شرح قصير\"}]";
  ask(p, 1500).then(function(t){
    var a = t.indexOf("["), b = t.lastIndexOf("]");
    var arr = JSON.parse(t.slice(a, b + 1));
    DECK = arr.filter(function(x){ return x && x.q && x.o && x.o.length >= 2; }).map(function(x){
      return {q:x.q, o:x.o, a:x.o[x.a] || "", e:x.e || "", svg:""};
    });
    if(!DECK.length) throw new Error("bad_json");
    idx = 0; show(); say("أسئلة عن: " + topic + " (" + DECK.length + ")");
  }).catch(function(e){
    if(e.message === "bad_key"){ needKey(); return; }
    say("تعذّر إنشاء الأسئلة. حاول مرة أخرى. (" + e.message + ")", true);
  }).then(function(){ busy = false; });
}

/* ---------- chat with Claude on screen ---------- */
var HIST = [];
var SYS = "أنت مساعد لمدرّس الفنون البصرية للصف الخامس والسادس في قطر. أجب بالعربية الفصحى المبسطة، بجمل قصيرة وواضحة، مناسبة للأطفال، وفي حدود 5 جمل.";
function renderChat(){
  var box = $("chat");
  box.innerHTML = HIST.slice(-6).map(function(m){ return m.role === "user" ? '<div class="me">' + m.content.replace(/[<&]/g,"") + '</div>' : '<div class="ai">' + m.content.replace(/[<&]/g,"") + '</div>'; }).join("");
  box.className = "show"; box.scrollTop = box.scrollHeight;
}
function chatSend(text){
  if(!key()){ needKey(); return; }
  if(busy) return;
  busy = true; say("أفكر ...");
  HIST.push({role:"user", content:text}); renderChat();
  ask(HIST.slice(-12), 700, SYS).then(function(r){
    HIST.push({role:"assistant", content:r.trim() || "..."}); renderChat(); say("تم الرد");
  }).catch(function(e){
    HIST.pop();
    if(e.message === "bad_key"){ needKey(); return; }
    say("تعذّر الرد. تأكد من الاتصال والمفتاح. (" + e.message + ")", true);
  }).then(function(){ busy = false; });
}

/* ---------- speech ---------- */
function handle(text){
  var t = norm(text), m;
  if((m = t.match(/^(ارسم|ارسمي|رسم)\s+(.+)$/))){ drawTopic(m[2]); return; }
  if((m = t.match(/^(اسال|اختبر|اختبار|سوال|اعمل اسئله|اسئله|اعمل اسئلة)\s*(عن)?\s*(.+)$/))){ topicQuiz(m[3]); return; }
  var short = t.split(" ").length <= 4;
  if(short && /تالي|التالي|الثاني|بعد/.test(t)){ next(); say("السؤال التالي"); return; }
  if(short && /سابق|السابق|رجوع/.test(t)){ prev(); say("السؤال السابق"); return; }
  if(short && /جواب|اجابه|الاجابه|اظهر/.test(t)){ reveal(); say(DECK[idx] && DECK[idx].a ? "الجواب: " + DECK[idx].a : "لا يوجد جواب لهذه الشاشة"); return; }
  if(short && /اعد|اعاده|كرر/.test(t)){ show(); say("أعدت السؤال"); return; }
  if(short && DECK[idx] && DECK[idx].a && t.indexOf(norm(DECK[idx].a)) !== -1){ reveal(); say("إجابة صحيحة: " + DECK[idx].a); return; }
  chatSend(text);
}
function startRec(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ say("هذا المتصفح لا يدعم المايك. افتح الصفحة في Safari على الآيفون أو Chrome على الكمبيوتر.", true); return false; }
  rec = new SR(); rec.lang = "ar-SA"; rec.continuous = true; rec.interimResults = false;
  rec.onresult = function(e){ for(var i = e.resultIndex; i < e.results.length; i++){ if(e.results[i].isFinal){ handle(e.results[i][0].transcript); } } };
  rec.onerror = function(e){ say(e.error === "not-allowed" ? "المايك ممنوع. اسمح للموقع باستخدام المايك من إعدادات المتصفح." : "خطأ في المايك: " + e.error, true); listening = false; setMic(); };
  rec.onend = function(){ if(listening){ try{ rec.start(); }catch(x){} } };
  try{ rec.start(); }catch(x){}
  return true;
}
function setMic(){ var b = $("mic"); b.className = listening ? "on" : ""; b.textContent = listening ? "⏹" : "🎤"; }
$("mic").onclick = function(){
  listening = !listening; setMic();
  if(listening){ if(startRec()) say("أستمع... قل مثلاً: ارسم فانوس، أو اسأل عن الفخار، أو اسألني أي سؤال"); }
  else { if(rec) rec.stop(); say("توقف المايك"); }
};
show();
</script>
