<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سؤال وصورة</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#7a1430;color:#fff7e6;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  #top{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;font-size:clamp(14px,2vw,18px);background:#5c0f24}
  #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 18px;gap:12px;min-height:0}
  #pic{width:min(92vw,calc((100vh - 230px)*1.6));aspect-ratio:800/500;background:#fff7e6;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0006}
  #pic svg{width:100%;height:100%;display:block}
  #q{font-size:clamp(24px,4.6vw,46px);font-weight:700;text-align:center;line-height:1.5;margin:0}
  #opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  #opts span{background:#f1dfb5;color:#6e1028;border-radius:14px;padding:8px 18px;font-size:clamp(18px,3vw,28px);font-weight:700}
  #ans{font-size:clamp(22px,3.8vw,38px);font-weight:800;color:#16090e;background:#e0a93f;border-radius:14px;padding:6px 22px;visibility:hidden}
  #ans.show{visibility:visible}
  #bar{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 16px 16px;background:#5c0f24}
  #mic{width:84px;height:84px;border-radius:50%;border:0;background:#e0a93f;color:#16090e;font-size:38px;cursor:pointer;box-shadow:0 6px 18px #0008}
  #mic.on{background:#2a9d9a;color:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 #2a9d9a88}50%{box-shadow:0 0 0 16px #2a9d9a00}}
  #status{font-size:clamp(14px,2vw,18px);text-align:center;min-height:1.4em;opacity:.9}
  #status.err{color:#ffd0d0}
</style>
</head>
<body>
<div id="top"><span id="num"></span><span>سؤال وصورة - الفنون البصرية</span></div>
<div id="stage">
  <div id="pic"></div>
  <p id="q"></p>
  <div id="opts"></div>
  <div id="ans"></div>
</div>
<div id="bar">
  <button id="mic" aria-label="المايك">🎤</button>
  <div id="status">اضغط المايك وقل: التالي، السابق، الجواب، أو اسم الإجابة</div>
</div>

var idx = 0, listening = false, rec = null;
var $ = function(id){ return document.getElementById(id); };
function norm(t){ return (t||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[إأآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").trim(); }
function show(){
  var s = SLIDES[idx];
  $("num").textContent = "السؤال " + (idx+1) + " من " + SLIDES.length;
  $("pic").innerHTML = s.svg;
  $("q").textContent = s.q;
  $("opts").innerHTML = s.o.map(function(o){ return "<span>" + o + "</span>"; }).join("");
  $("ans").textContent = "الجواب: " + s.a;
  $("ans").className = "";
}
function next(){ idx = (idx + 1) % SLIDES.length; show(); }
function prev(){ idx = (idx - 1 + SLIDES.length) % SLIDES.length; show(); }
function reveal(){ $("ans").className = "show"; }
function say(t){ $("status").textContent = t; $("status").className = ""; }
function handle(text){
  var t = norm(text);
  if(/تالي|التالي|الثاني|بعد/.test(t)){ next(); say("السؤال التالي"); return; }
  if(/سابق|السابق|رجوع/.test(t)){ prev(); say("السؤال السابق"); return; }
  if(/جواب|اجابه|الاجابه|اعطني الجواب|اظهر/.test(t)){ reveal(); say("الجواب: " + SLIDES[idx].a); return; }
  if(/اعد|اعاده|كرر/.test(t)){ show(); say("أعدت السؤال"); return; }
  if(t.indexOf(norm(SLIDES[idx].a)) !== -1){ reveal(); say("إجابة صحيحة: " + SLIDES[idx].a); return; }
  say("لم أفهم: " + text);
}
function startRec(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ $("status").className = "err"; say("هذا المتصفح لا يدعم المايك. افتح الصفحة في Safari على الآيفون أو Chrome على الكمبيوتر."); return; }
  rec = new SR(); rec.lang = "ar-SA"; rec.continuous = true; rec.interimResults = false;
  rec.onresult = function(e){ for(var i = e.resultIndex; i < e.results.length; i++){ if(e.results[i].isFinal){ handle(e.results[i][0].transcript); } } };
  rec.onerror = function(e){ $("status").className = "err"; say(e.error === "not-allowed" ? "المايك ممنوع. اسمح للموقع باستخدام المايك من إعدادات المتصفح." : "خطأ في المايك: " + e.error); listening = false; setMic(); };
  rec.onend = function(){ if(listening){ try{ rec.start(); }catch(x){} } };
  try{ rec.start(); }catch(x){}
}
function setMic(){ var b = $("mic"); b.className = listening ? "on" : ""; b.textContent = listening ? "⏹" : "🎤"; }
$("mic").onclick = function(){
  listening = !listening;
  setMic();
  if(listening){ startRec(); if(!rec) return; say("أستمع... قل: التالي، السابق، الجواب"); }
  else { if(rec) rec.stop(); say("توقف المايك"); }
};
show();
</script>
